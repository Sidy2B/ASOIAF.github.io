<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Trône de Fer — Guide d'écoute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --nuit:#070a10;
    --carte:#0e1420cc;
    --bord:rgba(238,241,245,.1);
    --neige:#eef1f5;
    --acier:#93a0b2;
    --sang:#9e1b1b;
    --bougie:#d4a94e;
    --rayon:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{height:100%}
  body{
    min-height:100dvh;
    font-family:'EB Garamond',serif;
    background:var(--nuit);
    color:var(--neige);
  }
  #atmo{position:fixed;inset:0;z-index:0;transition:background 1.4s ease}
  #fond{
    position:fixed;inset:-40px;z-index:0;
    background-size:cover;background-position:center;
    filter:blur(24px) brightness(.3) saturate(1.05);
    transition:opacity 1.2s ease;opacity:0;
  }
  #fond.ok{opacity:1}
  #atmo::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% 118%, transparent 30%, rgba(0,0,0,.7));
  }
  canvas#particles{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.55}

  /* ===== Structure générale ===== */
  .page{
    position:relative;z-index:2;
    max-width:1060px;margin:0 auto;padding:0 18px 26px;
  }
  header{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
    padding:16px 2px 14px;gap:8px 14px;
  }
  .entete-icones{display:flex;gap:8px;flex:none}
  .selecteurTome{display:flex;gap:6px;flex:none}
  .selecteurTome button{
    padding:0 14px;height:34px;border-radius:10px;cursor:pointer;
    font-family:'IM Fell English',serif;font-size:.85rem;letter-spacing:.04em;
    border:1px solid var(--bord);background:var(--carte);color:var(--acier);
    transition:all .25s;
  }
  .selecteurTome button.actif{border-color:var(--bougie);background:var(--bougie);color:#141005}
  .selecteurTome button:focus-visible{outline:2px solid var(--bougie);outline-offset:2px}
  header .book{
    font-family:'IM Fell English',serif;
    font-size:clamp(.85rem,2.6vw,1.02rem);
    letter-spacing:.22em;text-transform:uppercase;
    color:var(--acier);
  }
  header .book b{color:var(--bougie);font-weight:normal}
  header .book{flex:1;min-width:130px;text-align:center}
  #btnPleinEcran,#btnNuit{
    width:38px;height:38px;border-radius:12px;flex:none;
    border:1px solid var(--bord);
    background:var(--carte);color:var(--acier);
    font-size:1rem;cursor:pointer;transition:all .25s;
    backdrop-filter:blur(10px);
  }
  #btnPleinEcran.actif,#btnNuit.actif{border-color:var(--bougie);color:var(--bougie)}
  #btnPleinEcran:focus-visible,#btnNuit:focus-visible{outline:2px solid var(--bougie);outline-offset:2px}

  /* ===== Grille de widgets ===== */
  .grille{
    display:grid;gap:16px;
    grid-template-columns:1fr;
  }
  @media (min-width:900px){
    .grille{grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);align-items:start}
    .colonne{position:sticky;top:16px;display:flex;flex-direction:column;gap:16px}
  }
  @media (max-width:899px){
    .colonne{display:flex;flex-direction:column;gap:16px}
  }

  .colonnePrincipale{display:flex;flex-direction:column;gap:16px;min-width:0}
  .widget{
    background:var(--carte);backdrop-filter:blur(16px);
    border:1px solid var(--bord);border-radius:var(--rayon);
    box-shadow:0 18px 44px rgba(0,0,0,.45);
    overflow:hidden;
  }
  .widget-titre{
    display:flex;align-items:center;gap:9px;
    padding:12px 18px 10px;
    font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;
    color:var(--acier);
    border-bottom:1px solid var(--bord);
  }
  .widget-titre .picto{color:var(--bougie);font-style:normal}
  .widget-corps{padding:14px 18px 16px}

  /* ===== Widget scène ===== */
  #wScene .widget-corps{
    display:flex;flex-direction:column;gap:13px;text-align:center;
    animation:fadeIn .9s ease;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .chapitre{
    display:flex;align-items:center;justify-content:center;gap:11px;
    font-size:.8rem;letter-spacing:.3em;text-transform:uppercase;
    color:var(--bougie);
  }
  .chapitre svg{width:32px;height:32px;flex:none;filter:drop-shadow(0 3px 8px rgba(0,0,0,.6))}
  .chapitre img.blason{
    width:36px;height:36px;flex:none;border-radius:50%;object-fit:cover;
    border:1px solid var(--bord);
    box-shadow:0 4px 12px rgba(0,0,0,.55);
  }
  h1{
    font-family:'IM Fell English',serif;font-weight:normal;
    font-size:clamp(1.7rem,5.6vw,2.6rem);line-height:1.1;
    text-shadow:0 4px 22px rgba(0,0,0,.8);
  }
  .visuel{
    display:none;
    max-height:38dvh;width:100%;object-fit:cover;
    border-radius:14px;border:1px solid var(--bord);
    box-shadow:0 18px 46px rgba(0,0,0,.6);
  }
  .visuel.ok{display:block}
  .voile .visuel{filter:blur(16px)}
  .desc{
    font-size:1.07rem;line-height:1.65;color:#d6dce4;text-align:left;
  }
  .motscles{font-style:italic;color:var(--acier);font-size:.92rem}
  .motscles::before{content:"— ";color:var(--sang);font-style:normal}
  .scene-nav{display:flex;gap:10px;margin-top:2px}
  .scene-nav button{
    flex:1;padding:13px 0;border-radius:12px;cursor:pointer;
    font-family:'EB Garamond',serif;font-size:1.02rem;
    border:1px solid var(--bord);
    background:rgba(7,10,16,.55);color:var(--neige);
    transition:all .25s;
  }
  .scene-nav button:disabled{opacity:.3;cursor:default}
  .scene-nav button.next{border-color:var(--sang)}
  .scene-nav button.next:not(:disabled):hover{background:var(--sang)}
  .scene-nav button:focus-visible{outline:2px solid var(--bougie);outline-offset:2px}

  /* Anti-spoiler */
  .voile-zone{position:relative}
  .voile .flou{filter:blur(10px);user-select:none}
  .avert{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;z-index:3;
  }
  .avert p{font-style:italic;color:var(--acier)}
  .avert button{
    font-family:'EB Garamond',serif;font-size:1rem;
    padding:10px 24px;border-radius:999px;cursor:pointer;
    background:rgba(7,10,16,.85);color:var(--neige);
    border:1px solid var(--sang);transition:background .25s;
  }
  .avert button:hover{background:var(--sang)}

  /* ===== Widget chapitres (rail) ===== */
  .rail{
    display:flex;gap:6px;flex-wrap:wrap;justify-content:center;
  }
  .rail button{
    width:26px;height:26px;border-radius:9px;
    border:1px solid var(--bord);
    background:transparent;color:var(--acier);
    font-family:'EB Garamond',serif;font-size:.74rem;
    cursor:pointer;transition:all .22s;
  }
  .rail button.done{border-color:rgba(238,241,245,.4);color:var(--neige)}
  .rail button.active{
    border-color:var(--bougie);background:var(--bougie);
    color:#141005;transform:scale(1.12);font-weight:500;
  }
  .rail button.locked{opacity:.32}
  .rail button:focus-visible{outline:2px solid var(--bougie);outline-offset:2px}

  /* ===== Widget musique ===== */
  #wMusique .ligne{display:flex;align-items:center;gap:10px;margin-bottom:11px}
  #choixTheme{
    flex:1;min-width:0;padding:9px 10px;border-radius:10px;
    font-family:'EB Garamond',serif;font-size:.98rem;
    background:rgba(7,10,16,.65);color:var(--neige);
    border:1px solid var(--bord);cursor:pointer;
  }
  #choixTheme option{
    color:#1a1d24;background:#f2f4f8;
    font-family:'EB Garamond',serif;
  }
  #lecture{
    width:44px;height:41px;border-radius:10px;flex:none;cursor:pointer;
    font-size:1.05rem;
    background:transparent;color:var(--neige);
    border:1px solid var(--sang);transition:background .25s;
  }
  #lecture:hover{background:var(--sang)}
  #lecture.joue{background:var(--sang)}
  .ligneAuto{
    display:flex;align-items:center;gap:9px;margin-bottom:12px;
    font-size:.95rem;cursor:pointer;color:var(--neige);
  }
  .ligneAuto input{accent-color:var(--bougie);width:16px;height:16px;cursor:pointer}
  .ctrl-label{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;
    color:var(--acier);margin-bottom:4px;
  }
  #volume,#progression{width:100%;cursor:pointer;margin-bottom:10px}
  #volume{accent-color:var(--bougie)}
  #progression{accent-color:var(--sang);margin-bottom:2px}
  #temps{
    display:flex;justify-content:space-between;
    font-size:.83rem;color:var(--acier);
    font-variant-numeric:tabular-nums;
  }
  #wMusique .vide{font-size:.95rem;line-height:1.5;color:var(--acier);font-style:italic}
  #choixTheme:focus-visible,#volume:focus-visible,#progression:focus-visible,#lecture:focus-visible{
    outline:2px solid var(--bougie);outline-offset:2px;
  }

  /* ===== Widget carte ===== */
  #wCarte .widget-corps{padding-top:12px}
  .carteWrap{position:relative;width:fit-content;max-width:100%;margin:0 auto}
  #carteImg{
    display:block;max-height:34dvh;max-width:100%;
    border-radius:12px;border:1px solid var(--bord);
  }
  .pointCarte{position:absolute;transform:translate(-50%,-50%);width:0;height:0;pointer-events:none}
  .pointCarte .coeur{
    position:absolute;left:-5px;top:-5px;width:10px;height:10px;
    border-radius:50%;background:#c1121f;border:2px solid #fff;
    box-shadow:0 0 8px rgba(193,18,31,.9);
  }
  .pointCarte .halo{
    position:absolute;left:-12px;top:-12px;width:24px;height:24px;
    border-radius:50%;background:rgba(193,18,31,.35);
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(.7);opacity:.9}50%{transform:scale(1.3);opacity:.3}}
  .lieuNom{
    text-align:center;font-style:italic;color:var(--bougie);
    font-size:.95rem;margin-top:8px;
  }
  #btnAgrandir{
    display:block;width:100%;margin-top:10px;
    padding:10px 0;border-radius:10px;cursor:pointer;
    font-family:'EB Garamond',serif;font-size:.98rem;
    background:transparent;color:var(--neige);
    border:1px solid var(--bord);transition:all .25s;
  }
  #btnAgrandir:hover{border-color:var(--bougie);color:var(--bougie)}
  #btnAgrandir:focus-visible{outline:2px solid var(--bougie);outline-offset:2px}

  /* ===== Modale carte agrandie ===== */
  #modaleCarte{
    display:none;position:fixed;inset:0;z-index:50;
    background:rgba(3,5,9,.94);backdrop-filter:blur(8px);
    flex-direction:column;
  }
  #modaleCarte.ouverte{display:flex}
  .modale-barre{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 18px;flex:none;
  }
  .modale-barre .lieu{
    font-family:'IM Fell English',serif;font-size:1.05rem;color:var(--bougie);
  }
  .modale-barre .boutons{display:flex;gap:9px}
  .modale-barre button{
    height:40px;padding:0 16px;border-radius:11px;cursor:pointer;
    font-family:'EB Garamond',serif;font-size:.98rem;
    background:var(--carte);color:var(--neige);
    border:1px solid var(--bord);transition:all .25s;
  }
  .modale-barre button:hover{border-color:var(--bougie);color:var(--bougie)}
  .modale-barre button:focus-visible{outline:2px solid var(--bougie);outline-offset:2px}
  .modale-zone{
    flex:1;overflow:auto;display:grid;place-items:center;padding:0 14px 18px;
  }
  .modale-carteWrap{position:relative;width:fit-content;margin:auto}
  #modaleImg{
    display:block;border-radius:10px;
    max-width:100%;max-height:calc(100dvh - 92px);
    transition:max-width .3s ease, max-height .3s ease;
  }
  .modale-carteWrap.zoom #modaleImg{max-width:none;max-height:none;width:170vw}
  @media (min-width:900px){.modale-carteWrap.zoom #modaleImg{width:130vw}}
  .modale-carteWrap .pointCarte .coeur{width:13px;height:13px;left:-6.5px;top:-6.5px}
  .modale-carteWrap .pointCarte .halo{width:30px;height:30px;left:-15px;top:-15px}

  /* ===== Widget notes ===== */
  #wNotes textarea{
    width:100%;min-height:80px;resize:vertical;
    font-family:'EB Garamond',serif;font-size:.98rem;line-height:1.5;
    background:rgba(7,10,16,.6);color:var(--neige);
    border:1px solid var(--bord);border-radius:12px;
    padding:10px 12px;
  }
  #wNotes label{
    display:block;font-size:.74rem;letter-spacing:.18em;
    text-transform:uppercase;color:var(--acier);margin:0 0 5px;
  }
  #wNotes .espace{height:12px}
  #marquePage{
    width:100%;padding:9px 12px;border-radius:12px;
    font-family:'EB Garamond',serif;font-size:.98rem;
    background:rgba(7,10,16,.6);color:var(--neige);
    border:1px solid var(--bord);
  }
  #wNotes textarea:focus-visible,#marquePage:focus-visible{outline:2px solid var(--bougie);outline-offset:1px}

  /* ===== Widget personnages ===== */
  #persoListe{max-height:340px;overflow-y:auto;padding-right:4px}
  .perso{
    display:flex;gap:11px;align-items:flex-start;
    padding:9px 2px;border-bottom:1px solid var(--bord);
  }
  .perso:last-child{border-bottom:none}
  .miniB{width:30px;height:30px;flex:none;border-radius:50%;object-fit:cover;
    border:1px solid var(--bord);margin-top:2px}
  .portrait{
    width:44px;height:44px;flex:none;border-radius:10px;object-fit:cover;
    border:1px solid var(--bord);margin-top:1px;
    box-shadow:0 3px 10px rgba(0,0,0,.4);
  }
  .portrait.blasonRepli{border-radius:50%;object-fit:contain;background:rgba(255,255,255,.03);padding:4px}
  .persoNom{font-size:1rem;color:var(--neige)}
  .persoDesc{font-size:.88rem;color:var(--acier);line-height:1.45}
  .persoCompte{margin-left:auto;font-size:.74rem;letter-spacing:.1em;color:var(--bougie)}

  /* ===== Widget familles (arbre) ===== */
  #wFamille .widget-corps{overflow-x:auto}
  #arbre{min-width:680px;width:100%;display:block}
  #arbre text{font-family:'EB Garamond',serif;fill:var(--neige);font-size:12.5px}
  #arbre .boite{fill:rgba(7,10,16,.72);stroke:rgba(238,241,245,.28);rx:8}
  #arbre .sect{fill:var(--bougie);font-size:10.5px;letter-spacing:.2em}
  #arbre .mini{fill:var(--acier);font-size:9px;font-style:italic}
  #arbre .mariage{stroke:var(--bougie);stroke-width:1.6}
  #arbre .parente{stroke:#93a0b2;stroke-width:1.2;fill:none}
  #arbre .batard{stroke:#93a0b2;stroke-width:1.2;fill:none;stroke-dasharray:5 4}

  /* ===== Tracés de voyage sur les cartes ===== */
  .trajets{
    position:absolute;inset:0;width:100%;height:100%;
    pointer-events:none;
  }
  .trajets polyline{
    fill:none;stroke-width:2.2;stroke-dasharray:6 5;
    stroke-linecap:round;opacity:.9;
    vector-effect:non-scaling-stroke;
  }


  /* ===== Mode nuit d'écoute ===== */
  body.nuit .colonne{display:none}
  body.nuit #wFamille{display:none}
  body.nuit #wScene{background:transparent;border-color:transparent;box-shadow:none;backdrop-filter:none}
  body.nuit #wScene .widget-titre{display:none}
  body.nuit .desc,body.nuit .motscles{display:none}
  body.nuit .visuel{max-height:56dvh}
  body.nuit #fond{filter:blur(30px) brightness(.12) saturate(.8)}
  body.nuit canvas#particles{display:none}
  body.nuit header .book{opacity:.35}
  body.nuit .scene-nav button{opacity:.45;background:transparent;border-color:rgba(238,241,245,.12)}
  body.nuit .scene-nav button:hover{opacity:1}
  body.nuit .grille{grid-template-columns:1fr;max-width:720px;margin:0 auto}

  /* ===== Widget lexique ===== */
  #lexListe{max-height:280px;overflow-y:auto;padding-right:4px}
  .lex{padding:8px 2px;border-bottom:1px solid var(--bord)}
  .lex:last-child{border-bottom:none}
  .lexTerme{font-size:.98rem;color:var(--bougie)}
  .lexDef{font-size:.88rem;color:var(--acier);line-height:1.45}
  .lexCompte{margin-left:auto;font-size:.74rem;letter-spacing:.1em;color:var(--bougie)}

  /* ===== Écran d'accueil ===== */
  #accueil{
    position:fixed;inset:0;z-index:90;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;text-align:center;padding:24px;
    background:radial-gradient(ellipse at 50% 30%, #101623 0%, #05070c 70%);
    transition:opacity .7s ease;
  }
  #accueil.ferme{opacity:0;pointer-events:none}
  #accueil .eyebrow{font-size:.78rem;letter-spacing:.34em;text-transform:uppercase;color:var(--acier)}
  #accueil h2{
    font-family:'IM Fell English',serif;font-weight:normal;
    font-size:clamp(2.2rem,9vw,3.6rem);line-height:1.05;color:var(--neige);
    text-shadow:0 6px 30px rgba(0,0,0,.8);
  }
  #accueil .tome{font-style:italic;color:var(--bougie);margin-bottom:14px}
  #btnReprendre{
    font-family:'EB Garamond',serif;font-size:1.1rem;
    padding:14px 34px;border-radius:999px;cursor:pointer;
    background:var(--sang);color:var(--neige);
    border:1px solid var(--sang);transition:all .25s;
  }
  #btnReprendre:hover{filter:brightness(1.2)}
  #btnReprendre:focus-visible{outline:2px solid var(--bougie);outline-offset:3px}
  #btnRecommencer{
    font-family:'EB Garamond',serif;font-size:.92rem;
    background:none;border:none;cursor:pointer;
    color:var(--acier);text-decoration:underline;text-underline-offset:3px;
  }
  #btnRecommencer:hover{color:var(--neige)}


  /* ===== Widget Maisons ===== */
  #wMaisons{grid-column:1/-1}
  .grilleMaisons{
    display:grid;gap:14px;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  }
  .carteMaison{
    display:flex;flex-direction:column;gap:8px;
    background:rgba(255,255,255,.02);
    border:1px solid var(--bord);border-radius:14px;
    padding:14px 15px;
  }
  .carteMaison .entete{display:flex;align-items:center;gap:12px}
  .carteMaison .blasonM{
    width:52px;height:52px;flex:none;border-radius:50%;object-fit:cover;
    border:1px solid var(--bord);box-shadow:0 6px 16px rgba(0,0,0,.5);
  }
  .carteMaison .nomM{font-family:'IM Fell English',serif;font-size:1.18rem;color:var(--neige)}
  .carteMaison .devise{font-style:italic;color:var(--bougie);font-size:.9rem}
  .carteMaison .infosM{
    display:flex;flex-wrap:wrap;gap:6px 14px;
    font-size:.78rem;letter-spacing:.06em;color:var(--acier);
    text-transform:uppercase;
  }
  .carteMaison .infosM b{color:#c8d2e0;font-weight:normal}
  .carteMaison .descM{font-size:.9rem;line-height:1.5;color:#c8d2e0}

  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="atmo"></div>
<div id="fond"></div>
<canvas id="particles"></canvas>

<div class="page">
  <header>
    <div class="entete-icones">
      <button id="btnPleinEcran" aria-label="Passer en plein écran" title="Plein écran">⛶</button>
      <button id="btnNuit" aria-label="Activer le mode nuit" title="Mode nuit d'écoute">☾</button>
    </div>
    <div class="book"><b>Le Trône de Fer</b> · <span id="sousTitreTome">Tome 1</span> · Guide d'écoute</div>
    <div class="selecteurTome">
      <button data-tome="1" aria-label="Tome 1">I</button>
      <button data-tome="2" aria-label="Tome 2">II</button>
    </div>
  </header>

  <div class="grille">
    <!-- ===== Colonne principale : scène + familles ===== -->
    <div class="colonnePrincipale">
    <section class="widget" id="wScene">
      <div class="widget-titre"><span class="picto">◆</span> Chapitre en cours</div>
      <div class="widget-corps voile-zone" id="scene"></div>
    </section>

    <section class="widget" id="wMaisons">
      <div class="widget-titre"><span class="picto">🛡</span> Les grandes maisons</div>
      <div class="widget-corps"><div class="grilleMaisons" id="grilleMaisons"></div></div>
    </section>

    <section class="widget" id="wFamille">

/* ===== État & sauvegarde ===== */
const CLES = {1:'asoiaf-tome1', 2:'asoiaf-tome2'};
const DOSSIERS = {1:"le trone de fer 1", 2:"le trone de fer 2"};

let tomeActif = 1;
try{ const dernier = localStorage.getItem('asoiaf-tome-actif'); if(dernier) tomeActif = Number(dernier); }catch(e){}

let SCENES = (tomeActif===2) ? CHAPITRES_T2 : CHAPITRES_T1;
let CLE = CLES[tomeActif];
let DOSSIER = DOSSIERS[tomeActif];

function etatParDefaut(t){
  return {
    idx: 0, revealed: (t===1 ? [0,1,2,3,4,5] : [0]), volume: 20,
    theme: null, auto: false, notes: {}, marquePage: '', nuit: false
  };
}
let etat = etatParDefaut(tomeActif);
function charger(){
  try{
    const brut = localStorage.getItem(CLE);
    if(brut){ etat = Object.assign(etat, JSON.parse(brut)); }
  }catch(e){}
}
function sauver(){
  try{ localStorage.setItem(CLE, JSON.stringify(etat)); }catch(e){}
}
charger();

let idx = Math.min(Math.max(etat.idx,0), SCENES.length-1);
let revealed = new Set(etat.revealed);

/* ===== Éléments ===== */
const atmo    = document.getElementById('atmo');

const rail    = document.getElementById('rail');

/* ===== Rendu ===== */
function renderRail(){
  rail.innerHTML='';
  SCENES.forEach((s,i)=>{
    const b=document.createElement('button');
    b.textContent=i+1;
    b.setAttribute('aria-label','Chapitre '+(i+1)+' : '+s.titre);
    if(i===idx)b.classList.add('active');
    else if(revealed.has(i))b.classList.add('done');
    else b.classList.add('locked');
    b.onclick=()=>{idx=i;render();};
    rail.appendChild(b);
  });
}

function render(){
  const s=SCENES[idx];
  atmo.style.background=s.atmo;
  setParticles(s.part);
  const locked=!revealed.has(idx);
  sceneEl.className='widget-corps voile-zone'+(locked?' voile':'');
  sceneEl.innerHTML=`
    <div class="chapitre flou-non"><img class="blason" src="blasons/${s.maison}.png" alt="Blason"><span>${s.chap}</span></div>
    <h1 class="${locked?'flou':''}">${s.titre}</h1>
    <img class="visuel" id="visuel" alt="Illustration : ${s.titre}">
    <div class="desc ${locked?'flou':''}">${s.desc}</div>
    <div class="motscles ${locked?'flou':''}">${s.mots}</div>
    <div class="scene-nav">
      <button id="prev">← Précédent</button>
      <button id="next" class="next">Suivant →</button>
    </div>
    ${locked?`<div class="avert">
      <p>Tu n'es peut-être pas encore arrivé ici…</p>
      <button id="reveal">Révéler le chapitre</button>
    </div>`:''}
  `;
  const bl = sceneEl.querySelector('.blason');
  if(bl){ bl.onerror = ()=>{ bl.outerHTML = BLASONS[s.maison] || ''; }; }
  document.getElementById('prev').onclick=()=>{if(idx>0){idx--;render();}};
  document.getElementById('next').onclick=()=>{if(idx<SCENES.length-1){idx++;render();}};
  document.getElementById('prev').disabled = idx===0;
  document.getElementById('next').disabled = idx===SCENES.length-1;
  if(locked){
    document.getElementById('reveal').onclick=()=>{
      revealed.add(idx);
      etat.revealed=[...revealed];sauver();
      render();
    };
  }
  chargerImage(idx);

  /* Carte (widget + modale) */
  const l = LIEUX[s.lieu];
  lieuNom.textContent = l.nom;
  modaleLieu.textContent = l.nom;
  const srcCarte = `cartes/${l.carte}.png`;
  carteImg.src = srcCarte;
  modaleImg.src = srcCarte;
  const alt = l.carte==="essos" ? "Carte d'Essos" : "Carte de Westeros";
  carteImg.alt = alt; modaleImg.alt = alt;
  for(const p of [pointCarte, modalePoint]){
    p.style.left = l.x + "%";
    p.style.top  = l.y + "%";
  }

  /* Notes */
  notesTa.value = etat.notes[idx] || '';

  renderRail();
  etat.idx = idx; sauver();
  majProgressif();
  musiqueAuto();
}

notesTa.addEventListener('input', ()=>{
  etat.notes[idx] = notesTa.value; sauver();
});
marquePage.value = etat.marquePage || '';
marquePage.addEventListener('input', ()=>{
  etat.marquePage = marquePage.value; sauver();
});

/* ===== Modale carte agrandie ===== */
document.getElementById('btnAgrandir').onclick = ()=>{
  modale.classList.add('ouverte');
};
document.getElementById('btnFermerCarte').onclick = ()=>{
  modale.classList.remove('ouverte');
};
document.getElementById('btnZoom').onclick = (e)=>{
  modaleWrap.classList.toggle('zoom');
  e.target.textContent = modaleWrap.classList.contains('zoom') ? 'Réduire −' : 'Zoomer +';
};
modale.addEventListener('click', e=>{
  if(e.target === modale) modale.classList.remove('ouverte');
});
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape') modale.classList.remove('ouverte');
});

const BLASON_AUTRE = `<svg class="miniB" viewBox="0 0 34 34"><circle cx="17" cy="17" r="15.5" fill="#242b36" stroke="#4a5460" stroke-width="1.4"/><path d="M17 8 L17 25 M12 13 L22 13" stroke="#93a0b2" stroke-width="2" stroke-linecap="round"/></svg>`;
const MAISONS_FICHIERS = ["stark","targaryen","lannister","baratheon","arryn","tully","greyjoy","tyrell","frey","bolton","martell","garde"];

const EXT_PORTRAIT = ["jpg","jpeg","png","webp","JPG","JPEG","PNG","WEBP"];

function blasonReplifHTML(maison){
  return MAISONS_FICHIERS.includes(maison)
    ? `<img class="portrait blasonRepli miniB" src="blasons/${maison}.png" data-maison="${maison}" alt="">`
    : BLASON_AUTRE.replace('class="miniB"','class="portrait blasonRepli miniB"');
}

function majPersonnages(maxCh){
  const liste = document.getElementById('persoListe');
  const compte = document.getElementById('persoCompte');
  const visibles = PERSONNAGES.filter(p=>(p.tome||1) < tomeActif || ((p.tome||1)===tomeActif && p.ch<=maxCh));
  compte.textContent = visibles.length + ' rencontrés';
  liste.innerHTML = visibles.map(p=>
    `<div class="perso" data-slug="${p.slug}" data-maison="${p.maison}">
      <span class="portraitSlot">${blasonReplifHTML(p.maison)}</span>
      <div><div class="persoNom">${p.nom}</div><div class="persoDesc">${p.desc}</div></div>
    </div>`
  ).join('');
  liste.querySelectorAll('img.blasonRepli').forEach(im=>{
    im.onerror = ()=>{ im.outerHTML = BLASONS[im.dataset.maison] || BLASON_AUTRE; };
  });
  /* Tente de charger un vrai portrait par-dessus le blason, sans jamais casser l'affichage */
  liste.querySelectorAll('.perso').forEach(el=>{
    const slug = el.dataset.slug;
    let e = 0;
    function essayer(){
      if(e >= EXT_PORTRAIT.length) return;
      const img = new Image();
      img.onload = ()=>{
        const slot = el.querySelector('.portraitSlot');
        slot.innerHTML = `<img class="portrait" src="personnages/${slug}.${EXT_PORTRAIT[e]}" alt="Portrait de ${el.querySelector('.persoNom').textContent}">`;
      };
      img.onerror = ()=>{ e++; essayer(); };
      img.src = `personnages/${slug}.${EXT_PORTRAIT[e]}`;
    }
    essayer();
  });
}

  if(!svg) return;

function chargerImage(i){

  if(!img) return;
  const num = String(i+1).padStart(2,'0');

  function essayer(){
    if(e >= EXTS.length){
      img.classList.remove('ok');
      fond.classList.remove('ok');

      img.classList.add('ok');

let fonduTimer = null;
const themes = [];

async function testerFichier(src){
  /* En ligne (GitHub Pages, etc.) : simple requête réseau, fiable partout y compris iPhone */
  try{
    const r = await fetch(src, {method:'HEAD'});
    return r.ok;
  }catch(e){
    /* Usage local (fichier ouvert directement) : repli sur le préchargement audio, avec délai maxi */
    return new Promise(res=>{
      const t = new Audio();
      const fin = setTimeout(()=>res(false), 3000);
      t.onloadedmetadata = ()=>{ clearTimeout(fin); res(true); };
      t.oncanplaythrough = ()=>{ clearTimeout(fin); res(true); };
      t.onerror = ()=>{ clearTimeout(fin); res(false); };
      t.preload = 'metadata';
      t.src = src;
    });
  }
}

(async function detecterThemes(){
  for(const maison of MAISONS_MUSIQUE){
    for(const v of VARIANTES){
      let trouve = false;
      for(const ext of EXT_AUDIO){
        const nomFichier = `${maison} theme${v}.${ext}`;
        if(await testerFichier(`musique/${encodeURIComponent(nomFichier)}`)){
          themes.push({nom:`${maison}${v?` (${v.trim()})`:''}`, base:maison, src:`musique/${nomFichier}`});
          trouve = true;
          break;
        }
      }
      if(v==="" && !trouve) break;
    }
  }
  if(themes.length === 0){
    corpsMusique.innerHTML = '<p class="vide">Aucune musique installée. Dépose tes fichiers dans le dossier « musique » (ex : Stark theme.mp3) — voir le LISEZ-MOI du dossier.</p>';
    return;
  }
  for(const th of themes){
    const opt = document.createElement('option');
    opt.value = th.src;
    opt.textContent = th.nom;
    choix.appendChild(opt);
  }
  if(etat.theme && themes.some(t=>t.src===etat.theme)){
    choix.value = etat.theme;
  }
  if(choix.selectedIndex < 0) choix.selectedIndex = 0;
  actif.src = choix.value;
})();

function jouerTheme(src, fondu){
  if(actif.src.endsWith(encodeURI(src)) || actif.src===src){ return; }
  etat.theme = src; sauver();
  if(!fondu || actif.paused){
    actif.pause();
    actif = new Audio(src);
    actif.loop = true;
    actif.volume = volCible;
    return;
  }
  const ancien = actif;
  const nouveau = new Audio(src);
  nouveau.loop = true;
  nouveau.volume = 0;
  nouveau.play().catch(()=>{});
  actif = nouveau;
  if(fonduTimer) clearInterval(fonduTimer);
  const duree = 1600, pas = 40;
  let t = 0;
  fonduTimer = setInterval(()=>{
    t += pas;
    const r = Math.min(t/duree, 1);
    nouveau.volume = volCible * r;
    ancien.volume  = Math.max(volCible * (1-r), 0);
    if(r >= 1){
      clearInterval(fonduTimer); fonduTimer = null;
      ancien.pause();
    }
  }, pas);
}

function musiqueAuto(){
  if(!autoChk.checked || themes.length===0) return;
  const prefs = SCENES[idx].themes || [];
  for(const p of prefs){
    const th = themes.find(t=>t.base===p);
    if(th){
      choix.value = th.src;
      jouerTheme(th.src, true);
      return;
    }
  }
}

choix.onchange = ()=>{ jouerTheme(choix.value, true); };

autoChk.onchange = ()=>{
  etat.auto = autoChk.checked; sauver();
  if(autoChk.checked) musiqueAuto();
};

volume.oninput = ()=>{
  volCible = volume.value/100;
  volAffiche.textContent = volume.value + '%';
  if(!fonduTimer) actif.volume = volCible;
  etat.volume = Number(volume.value); sauver();
};

lecture.onclick = ()=>{

    if(!actif.src && choix.value) { actif.src = choix.value; }
    actif.play().catch(()=>{});
    lecture.textContent = '❚❚';
    lecture.classList.add('joue');
  }else{
    actif.pause();
    lecture.textContent = '▶';
    lecture.classList.remove('joue');
  }
};

let glisse = false;
function formatTemps(s){
  if(!isFinite(s)) return '0:00';
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return `${m}:${String(sec).padStart(2,'0')}`;
}
setInterval(()=>{
  if(glisse || !actif.duration) return;
  progression.value = (actif.currentTime / actif.duration) * 1000;
  tempsActuel.textContent = formatTemps(actif.currentTime);
  tempsTotal.textContent  = formatTemps(actif.duration);
}, 400);
progression.addEventListener('input', ()=>{
  glisse = true;
  if(actif.duration) tempsActuel.textContent = formatTemps((progression.value/1000)*actif.duration);
});
progression.addEventListener('change', ()=>{
  if(actif.duration) actif.currentTime = (progression.value/1000)*actif.duration;
  glisse = false;
});

  return document.fullscreenElement || document.webkitFullscreenElement;

/* ===== Particules d'ambiance ===== */
const cv=document.getElementById('particles');
const ctx=cv.getContext('2d');
let parts=[], mode='neige';
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

function resize(){cv.width=innerWidth;cv.height=innerHeight;}
addEventListener('resize',resize);resize();

function setParticles(m){
  mode=m;parts=[];
  const n = m==='feuilles'?26 : m==='braises'?36 : 60;
  for(let i=0;i<n;i++){
    parts.push({
      x:Math.random()*cv.width,
      y:Math.random()*cv.height,
      r:Math.random()*(m==='feuilles'?5:2.4)+1,
      v:Math.random()*.6+.25,
      a:Math.random()*Math.PI*2
    });
  }
}

function tick(){
  ctx.clearRect(0,0,cv.width,cv.height);
  for(const p of parts){
    p.a+=.01;
    if(mode==='braises'){
      p.y-=p.v; p.x+=Math.sin(p.a)*.5;
      ctx.fillStyle=`rgba(220,${120+Math.floor(Math.sin(p.a)*40+60)},40,.7)`;
    }else if(mode==='feuilles'){
      p.y+=p.v*.8; p.x+=Math.sin(p.a)*1.1;
      ctx.fillStyle='rgba(163,44,44,.75)';
    }else{
      p.y+=p.v; p.x+=Math.sin(p.a)*.4;
      ctx.fillStyle='rgba(232,236,241,.7)';
    }
    if(p.y>cv.height+10)p.y=-10;
    if(p.y<-10)p.y=cv.height+10;
    if(p.x>cv.width+10)p.x=-10;
    if(p.x<-10)p.x=cv.width+10;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
  }
  requestAnimationFrame(tick);
}
if(!reduced){tick();}
