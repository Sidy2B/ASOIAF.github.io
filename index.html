<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Trône de Fer — Guide d'écoute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --nuit:#070a10;
    --carte:#0e1420cc;
    --bord:rgba(238,241,245,.1);
    --neige:#eef1f5;
    --acier:#93a0b2;
    --sang:#9e1b1b;
    --bougie:#d4a94e;
    --rayon:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{height:100%}
  body{
    min-height:100dvh;
    font-family:'EB Garamond',serif;
    background:var(--nuit);
    color:var(--neige);
  }
  #atmo{position:fixed;inset:0;z-index:0;transition:background 1.4s ease}
  #fond{
    position:fixed;inset:-40px;z-index:0;
    background-size:cover;background-position:center;
    filter:blur(24px) brightness(.3) saturate(1.05);
    transition:opacity 1.2s ease;opacity:0;
  }
  #fond.ok{opacity:1}
  #atmo::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% 118%, transparent 30%, rgba(0,0,0,.7));
  }
  canvas#particles{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.55}

  /* ===== Structure générale ===== */
  .page{
    position:relative;z-index:2;
    max-width:1060px;margin:0 auto;padding:0 18px 26px;
  }
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 2px 14px;gap:12px;
  }
  header .book{
    font-family:'IM Fell English',serif;
    font-size:clamp(.85rem,2.6vw,1.02rem);
    letter-spacing:.22em;text-transform:uppercase;
    color:var(--acier);
  }
  header .book b{color:var(--bougie);font-weight:normal}
  #btnPleinEcran{
    width:38px;height:38px;border-radius:12px;flex:none;
    border:1px solid var(--bord);
    background:var(--carte);color:var(--acier);
    font-size:1rem;cursor:pointer;transition:all .25s;
    backdrop-filter:blur(10px);
  }
  #btnPleinEcran.actif{border-color:var(--bougie);color:var(--bougie)}
  #btnPleinEcran:focus-visible{outline:2px solid var(--bougie);outline-offset:2px}

  /* ===== Grille de widgets ===== */
  .grille{
    display:grid;gap:16px;
    grid-template-columns:1fr;
  }
  @media (min-width:900px){
    .grille{grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);align-items:start}
    .colonne{position:sticky;top:16px;display:flex;flex-direction:column;gap:16px}
  }
  @media (max-width:899px){
    .colonne{display:flex;flex-direction:column;gap:16px}
  }

  .widget{
    background:var(--carte);backdrop-filter:blur(16px);
    border:1px solid var(--bord);border-radius:var(--rayon);
    box-shadow:0 18px 44px rgba(0,0,0,.45);
    overflow:hidden;
  }
  .widget-titre{
    display:flex;align-items:center;gap:9px;
    padding:12px 18px 10px;
    font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;
    color:var(--acier);
    border-bottom:1px solid var(--bord);
  }
  .widget-titre .picto{color:var(--bougie);font-style:normal}
  .widget-corps{padding:14px 18px 16px}

  /* ===== Widget scène ===== */
  #wScene .widget-corps{
    display:flex;flex-direction:column;gap:13px;text-align:center;
    animation:fadeIn .9s ease;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .chapitre{
    display:flex;align-items:center;justify-content:center;gap:11px;
    font-size:.8rem;letter-spacing:.3em;text-transform:uppercase;
    color:var(--bougie);
  }
  .chapitre svg{width:32px;height:32px;flex:none;filter:drop-shadow(0 3px 8px rgba(0,0,0,.6))}
  .chapitre img.blason{
    width:36px;height:36px;flex:none;border-radius:50%;object-fit:cover;
    border:1px solid var(--bord);
    box-shadow:0 4px 12px rgba(0,0,0,.55);
  }
  h1{
    font-family:'IM Fell English',serif;font-weight:normal;
    font-size:clamp(1.7rem,5.6vw,2.6rem);line-height:1.1;
    text-shadow:0 4px 22px rgba(0,0,0,.8);
  }
  .visuel{
    display:none;
    max-height:38dvh;width:100%;object-fit:cover;
    border-radius:14px;border:1px solid var(--bord);
    box-shadow:0 18px 46px rgba(0,0,0,.6);
  }
  .visuel.ok{display:block}
  .voile .visuel{filter:blur(16px)}
  .desc{
    font-size:1.07rem;line-height:1.65;color:#d6dce4;text-align:left;
  }
  .motscles{font-style:italic;color:var(--acier);font-size:.92rem}
  .motscles::before{content:"— ";color:var(--sang);font-style:normal}
  .scene-nav{display:flex;gap:10px;margin-top:2px}
  .scene-nav button{
    flex:1;padding:13px 0;border-radius:12px;cursor:pointer;
    font-family:'EB Garamond',serif;font-size:1.02rem;
    border:1px solid var(--bord);
    background:rgba(7,10,16,.55);color:var(--neige);
    transition:all .25s;
  }
  .scene-nav button:disabled{opacity:.3;cursor:default}
  .scene-nav button.next{border-color:var(--sang)}
  .scene-nav button.next:not(:disabled):hover{background:var(--sang)}
  .scene-nav button:focus-visible{outline:2px solid var(--bougie);outline-offset:2px}

  /* Anti-spoiler */
  .voile-zone{position:relative}
  .voile .flou{filter:blur(10px);user-select:none}
  .avert{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;z-index:3;
  }
  .avert p{font-style:italic;color:var(--acier)}
  .avert button{
    font-family:'EB Garamond',serif;font-size:1rem;
    padding:10px 24px;border-radius:999px;cursor:pointer;
    background:rgba(7,10,16,.85);color:var(--neige);
    border:1px solid var(--sang);transition:background .25s;
  }
  .avert button:hover{background:var(--sang)}

  /* ===== Widget chapitres (rail) ===== */
  .rail{
    display:flex;gap:6px;flex-wrap:wrap;justify-content:center;
  }
  .rail button{
    width:26px;height:26px;border-radius:9px;
    border:1px solid var(--bord);
    background:transparent;color:var(--acier);
    font-family:'EB Garamond',serif;font-size:.74rem;
    cursor:pointer;transition:all .22s;
  }
  .rail button.done{border-color:rgba(238,241,245,.4);color:var(--neige)}
  .rail button.active{
    border-color:var(--bougie);background:var(--bougie);
    color:#141005;transform:scale(1.12);font-weight:500;
  }
  .rail button.locked{opacity:.32}
  .rail button:focus-visible{outline:2px solid var(--bougie);outline-offset:2px}

  /* ===== Widget musique ===== */
  #wMusique .ligne{display:flex;align-items:center;gap:10px;margin-bottom:11px}
  #choixTheme{
    flex:1;min-width:0;padding:9px 10px;border-radius:10px;
    font-family:'EB Garamond',serif;font-size:.98rem;
    background:rgba(7,10,16,.65);color:var(--neige);
    border:1px solid var(--bord);cursor:pointer;
  }
  #lecture{
    width:44px;height:41px;border-radius:10px;flex:none;cursor:pointer;
    font-size:1.05rem;
    background:transparent;color:var(--neige);
    border:1px solid var(--sang);transition:background .25s;
  }
  #lecture:hover{background:var(--sang)}
  #lecture.joue{background:var(--sang)}
  .ligneAuto{
    display:flex;align-items:center;gap:9px;margin-bottom:12px;
    font-size:.95rem;cursor:pointer;color:var(--neige);
  }
  .ligneAuto input{accent-color:var(--bougie);width:16px;height:16px;cursor:pointer}
  .ctrl-label{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;
    color:var(--acier);margin-bottom:4px;
  }
  #volume,#progression{width:100%;cursor:pointer;margin-bottom:10px}
  #volume{accent-color:var(--bougie)}
  #progression{accent-color:var(--sang);margin-bottom:2px}
  #temps{
    display:flex;justify-content:space-between;
    font-size:.83rem;color:var(--acier);
    font-variant-numeric:tabular-nums;
  }
  #wMusique .vide{font-size:.95rem;line-height:1.5;color:var(--acier);font-style:italic}
  #choixTheme:focus-visible,#volume:focus-visible,#progression:focus-visible,#lecture:focus-visible{
    outline:2px solid var(--bougie);outline-offset:2px;
  }

  /* ===== Widget carte ===== */
  #wCarte .widget-corps{padding-top:12px}
  .carteWrap{position:relative;width:fit-content;max-width:100%;margin:0 auto}
  #carteImg{
    display:block;max-height:34dvh;max-width:100%;
    border-radius:12px;border:1px solid var(--bord);
  }
  .pointCarte{position:absolute;transform:translate(-50%,-50%);width:0;height:0;pointer-events:none}
  .pointCarte .coeur{
    position:absolute;left:-5px;top:-5px;width:10px;height:10px;
    border-radius:50%;background:#c1121f;border:2px solid #fff;
    box-shadow:0 0 8px rgba(193,18,31,.9);
  }
  .pointCarte .halo{
    position:absolute;left:-12px;top:-12px;width:24px;height:24px;
    border-radius:50%;background:rgba(193,18,31,.35);
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(.7);opacity:.9}50%{transform:scale(1.3);opacity:.3}}
  .lieuNom{
    text-align:center;font-style:italic;color:var(--bougie);
    font-size:.95rem;margin-top:8px;
  }
  #btnAgrandir{
    display:block;width:100%;margin-top:10px;
    padding:10px 0;border-radius:10px;cursor:pointer;
    font-family:'EB Garamond',serif;font-size:.98rem;
    background:transparent;color:var(--neige);
    border:1px solid var(--bord);transition:all .25s;
  }
  #btnAgrandir:hover{border-color:var(--bougie);color:var(--bougie)}
  #btnAgrandir:focus-visible{outline:2px solid var(--bougie);outline-offset:2px}

  /* ===== Modale carte agrandie ===== */
  #modaleCarte{
    display:none;position:fixed;inset:0;z-index:50;
    background:rgba(3,5,9,.94);backdrop-filter:blur(8px);
    flex-direction:column;
  }
  #modaleCarte.ouverte{display:flex}
  .modale-barre{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 18px;flex:none;
  }
  .modale-barre .lieu{
    font-family:'IM Fell English',serif;font-size:1.05rem;color:var(--bougie);
  }
  .modale-barre .boutons{display:flex;gap:9px}
  .modale-barre button{
    height:40px;padding:0 16px;border-radius:11px;cursor:pointer;
    font-family:'EB Garamond',serif;font-size:.98rem;
    background:var(--carte);color:var(--neige);
    border:1px solid var(--bord);transition:all .25s;
  }
  .modale-barre button:hover{border-color:var(--bougie);color:var(--bougie)}
  .modale-barre button:focus-visible{outline:2px solid var(--bougie);outline-offset:2px}
  .modale-zone{
    flex:1;overflow:auto;display:grid;place-items:center;padding:0 14px 18px;
  }
  .modale-carteWrap{position:relative;width:fit-content;margin:auto}
  #modaleImg{
    display:block;border-radius:10px;
    max-width:100%;max-height:calc(100dvh - 92px);
    transition:max-width .3s ease, max-height .3s ease;
  }
  .modale-carteWrap.zoom #modaleImg{max-width:none;max-height:none;width:170vw}
  @media (min-width:900px){.modale-carteWrap.zoom #modaleImg{width:130vw}}
  .modale-carteWrap .pointCarte .coeur{width:13px;height:13px;left:-6.5px;top:-6.5px}
  .modale-carteWrap .pointCarte .halo{width:30px;height:30px;left:-15px;top:-15px}

  /* ===== Widget notes ===== */
  #wNotes textarea{
    width:100%;min-height:80px;resize:vertical;
    font-family:'EB Garamond',serif;font-size:.98rem;line-height:1.5;
    background:rgba(7,10,16,.6);color:var(--neige);
    border:1px solid var(--bord);border-radius:12px;
    padding:10px 12px;
  }
  #wNotes label{
    display:block;font-size:.74rem;letter-spacing:.18em;
    text-transform:uppercase;color:var(--acier);margin:0 0 5px;
  }
  #wNotes .espace{height:12px}
  #marquePage{
    width:100%;padding:9px 12px;border-radius:12px;
    font-family:'EB Garamond',serif;font-size:.98rem;
    background:rgba(7,10,16,.6);color:var(--neige);
    border:1px solid var(--bord);
  }
  #wNotes textarea:focus-visible,#marquePage:focus-visible{outline:2px solid var(--bougie);outline-offset:1px}

  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="atmo"></div>
<div id="fond"></div>
<canvas id="particles"></canvas>

<div class="page">
  <header>
    <div class="book"><b>Le Trône de Fer</b> · Tome 1 · Guide d'écoute</div>
    <button id="btnPleinEcran" aria-label="Passer en plein écran" title="Plein écran">⛶</button>
  </header>

  <div class="grille">
    <!-- ===== Colonne principale : la scène ===== -->
    <section class="widget" id="wScene">
      <div class="widget-titre"><span class="picto">◆</span> Chapitre en cours</div>
      <div class="widget-corps voile-zone" id="scene"></div>
    </section>

    <!-- ===== Colonne widgets ===== -->
    <div class="colonne">
      <section class="widget" id="wChapitres">
        <div class="widget-titre"><span class="picto">⁝⁝</span> Chapitres</div>
        <div class="widget-corps"><div class="rail" id="rail"></div></div>
      </section>

      <section class="widget" id="wMusique">
        <div class="widget-titre"><span class="picto">♪</span> Musique</div>
        <div class="widget-corps" id="corpsMusique">
          <div class="ligne">
            <select id="choixTheme" aria-label="Choisir le thème musical"></select>
            <button id="lecture" aria-label="Lancer ou couper la musique">▶</button>
          </div>
          <label class="ligneAuto"><input type="checkbox" id="autoMusique"> Thème choisi selon le chapitre</label>
          <div class="ctrl-label"><span>Volume</span><span id="volAffiche">20%</span></div>
          <input type="range" id="volume" min="0" max="100" value="20">
          <div class="ctrl-label"><span>Position</span></div>
          <input type="range" id="progression" min="0" max="1000" value="0">
          <div id="temps"><span id="tempsActuel">0:00</span><span id="tempsTotal">0:00</span></div>
        </div>
      </section>

      <section class="widget" id="wCarte">
        <div class="widget-titre"><span class="picto">✦</span> Carte</div>
        <div class="widget-corps">
          <div class="carteWrap">
            <img id="carteImg" src="cartes/westeros.png" alt="Carte de Westeros">
            <div class="pointCarte" id="pointCarte"><span class="halo"></span><span class="coeur"></span></div>
          </div>
          <div class="lieuNom" id="lieuNom"></div>
          <button id="btnAgrandir">Agrandir la carte ⤢</button>
        </div>
      </section>

      <section class="widget" id="wNotes">
        <div class="widget-titre"><span class="picto">✎</span> Notes & marque-page</div>
        <div class="widget-corps">
          <label for="notesChapitre">Notes sur ce chapitre</label>
          <textarea id="notesChapitre" placeholder="Impressions, théories, personnages à retenir…"></textarea>
          <div class="espace"></div>
          <label for="marquePage">Marque-page audio (où j'en suis dans Audible)</label>
          <input type="text" id="marquePage" placeholder="Ex : 4 h 32 min — chapitre 12">
        </div>
      </section>
    </div>
  </div>
</div>

<!-- ===== Modale carte agrandie ===== -->
<div id="modaleCarte" role="dialog" aria-modal="true" aria-label="Carte agrandie">
  <div class="modale-barre">
    <span class="lieu" id="modaleLieu"></span>
    <div class="boutons">
      <button id="btnZoom">Zoomer +</button>
      <button id="btnFermerCarte">Fermer ✕</button>
    </div>
  </div>
  <div class="modale-zone">
    <div class="modale-carteWrap" id="modaleWrap">
      <img id="modaleImg" src="cartes/westeros.png" alt="Carte agrandie">
      <div class="pointCarte" id="modalePoint"><span class="halo"></span><span class="coeur"></span></div>
    </div>
  </div>
</div>

<script>
/* =====================================================
   DONNÉES — 36 chapitres du livre audio
===================================================== */
const LIEUX = {
  audela:   {nom:"Au-delà du Mur — la forêt hantée", carte:"westeros", x:59.0, y:5.8},
  mur:      {nom:"Châteaunoir · le Mur", carte:"westeros", x:58.5, y:9.0},
  versmur:  {nom:"La route royale, vers le Mur", carte:"westeros", x:49.0, y:16.0},
  winterfell:{nom:"Winterfell", carte:"westeros", x:44.0, y:23.6},
  routeroy: {nom:"La route royale, vers le sud", carte:"westeros", x:42.5, y:38.0},
  trident:  {nom:"Le Trident", carte:"westeros", x:55.0, y:56.8},
  darry:    {nom:"Château de Darry", carte:"westeros", x:62.0, y:58.0},
  auberge:  {nom:"L'auberge du carrefour", carte:"westeros", x:54.0, y:56.0},
  eyrie:    {nom:"Les Eyrié · le Val d'Arryn", carte:"westeros", x:66.5, y:49.6},
  hauteroute:{nom:"La haute route · montagnes de la Lune", carte:"westeros", x:63.0, y:52.3},
  portreal: {nom:"Port-Réal", carte:"westeros", x:68.0, y:69.2},
  pentos:   {nom:"Pentos — en Essos", carte:"essos", x:10.5, y:47.0},
  merdothrak:{nom:"La mer Dothrak — en Essos", carte:"essos", x:55.5, y:58.5},
  khalasar: {nom:"Avec le khalasar, vers l'est — en Essos", carte:"essos", x:33.0, y:50.0}
};

const TH_NORD   = ["Stark","Main theme"];
const TH_GARDE  = ["Garde de Nuit","Stark","Main theme"];
const TH_SUD    = ["Baratheon","Lannister","Main theme"];
const TH_TARG   = ["Targaryen","Dothraki","Main theme"];
const TH_LANN   = ["Lannister","Main theme"];
const TH_TULLY  = ["Tully","Stark","Main theme"];
const TH_ARRYN  = ["Arryn","Tully","Main theme"];

const SCENES = [
  {chap:"Chapitre 1 · Prologue",titre:"Au-delà du Mur",desc:"Trois patrouilleurs de la Garde de Nuit s'enfoncent dans la forêt hantée, sur la piste de sauvageons. Le froid tombe, trop vite, trop fort — et quelque chose les observe entre les arbres.",mots:"forêt hantée · givre · ombres pâles",atmo:"linear-gradient(180deg,#0a0f16 0%,#14202e 55%,#233648 100%)",part:"neige",maison:"garde",lieu:"audela",themes:TH_GARDE},
  {chap:"Chapitre 2 · Bran",titre:"L'exécution du déserteur",desc:"Ned Stark décapite lui-même un déserteur devant ses fils. « Celui qui prononce la sentence doit tenir l'épée. » Sur le chemin du retour : une louve géante morte, et ses petits encore vivants.",mots:"billot · Glace · six louveteaux et un blanc",atmo:"linear-gradient(180deg,#1a2230 0%,#2c3a4d 55%,#46586e 100%)",part:"neige",maison:"stark",lieu:"winterfell",themes:TH_NORD},
  {chap:"Chapitre 3 · Catelyn",titre:"Le bois sacré",desc:"Catelyn rejoint Ned sous le barral, arbre blanc aux feuilles rouge sang. Elle apporte deux nouvelles : Jon Arryn, la Main du Roi, est mort — et le roi Robert chevauche vers Winterfell.",mots:"barral · étangs noirs · une lettre du sud",atmo:"linear-gradient(180deg,#111820 0%,#1e2a28 50%,#31261f 100%)",part:"feuilles",maison:"stark",lieu:"winterfell",themes:TH_NORD},
  {chap:"Chapitre 4 · Daenerys",titre:"La promise de Pentos",desc:"De l'autre côté du détroit, Daenerys Targaryen est offerte par son frère Viserys à Khal Drogo, seigneur de cheval dothraki. Soies, épices — et la peur d'une enfant vendue contre une armée.",mots:"villa d'Illyrio · soie violette · la mer étroite",atmo:"linear-gradient(180deg,#2a1a2e 0%,#57263a 50%,#8f5a3a 100%)",part:"braises",maison:"targaryen",lieu:"pentos",themes:TH_TARG},
  {chap:"Chapitre 5 · Eddard",titre:"L'arrivée du roi",desc:"Robert Baratheon franchit les portes de Winterfell avec toute sa cour. Dans les cryptes, devant la tombe de Lyanna, il demande à Ned de devenir sa nouvelle Main.",mots:"bannières · cryptes · la statue de Lyanna",atmo:"linear-gradient(180deg,#202836 0%,#3d4657 45%,#6b6353 100%)",part:"neige",maison:"stark",lieu:"winterfell",themes:TH_NORD},

/* ===== État & sauvegarde ===== */
const CLE = 'asoiaf-tome1';
let etat = {
  idx: 0, revealed: [0,1,2,3,4,5], volume: 20,
  theme: null, auto: false, notes: {}, marquePage: ''
};
function charger(){
  try{
    const brut = localStorage.getItem(CLE);
    if(brut){ etat = Object.assign(etat, JSON.parse(brut)); }
  }catch(e){}
}
function sauver(){
  try{ localStorage.setItem(CLE, JSON.stringify(etat)); }catch(e){}
}
charger();

let idx = Math.min(Math.max(etat.idx,0), SCENES.length-1);
let revealed = new Set(etat.revealed);

/* ===== Rendu ===== */
function renderRail(){
  rail.innerHTML='';
  SCENES.forEach((s,i)=>{
    const b=document.createElement('button');
    b.textContent=i+1;
    b.setAttribute('aria-label','Chapitre '+(i+1)+' : '+s.titre);
    if(i===idx)b.classList.add('active');
    else if(revealed.has(i))b.classList.add('done');
    else b.classList.add('locked');
    b.onclick=()=>{idx=i;render();};
    rail.appendChild(b);
  });
}

function render(){
  const s=SCENES[idx];
  atmo.style.background=s.atmo;
  setParticles(s.part);
  const locked=!revealed.has(idx);
  sceneEl.className='widget-corps voile-zone'+(locked?' voile':'');
  sceneEl.innerHTML=`
    <div class="chapitre flou-non"><img class="blason" src="blasons/${s.maison}.png" alt="Blason"><span>${s.chap}</span></div>
    <h1 class="${locked?'flou':''}">${s.titre}</h1>
    <img class="visuel" id="visuel" alt="Illustration : ${s.titre}">
    <div class="desc ${locked?'flou':''}">${s.desc}</div>
    <div class="motscles ${locked?'flou':''}">${s.mots}</div>
    <div class="scene-nav">
      <button id="prev">← Précédent</button>
      <button id="next" class="next">Suivant →</button>
    </div>
    ${locked?`<div class="avert">
      <p>Tu n'es peut-être pas encore arrivé ici…</p>
      <button id="reveal">Révéler le chapitre</button>
    </div>`:''}
  `;
  const bl = sceneEl.querySelector('.blason');
  if(bl){ bl.onerror = ()=>{ bl.outerHTML = BLASONS[s.maison] || ''; }; }
  document.getElementById('prev').onclick=()=>{if(idx>0){idx--;render();}};
  document.getElementById('next').onclick=()=>{if(idx<SCENES.length-1){idx++;render();}};
  document.getElementById('prev').disabled = idx===0;
  document.getElementById('next').disabled = idx===SCENES.length-1;
  if(locked){
    document.getElementById('reveal').onclick=()=>{
      revealed.add(idx);
      etat.revealed=[...revealed];sauver();
      render();
    };
  }
  chargerImage(idx);

  /* Carte (widget + modale) */
  const l = LIEUX[s.lieu];
  lieuNom.textContent = l.nom;
  modaleLieu.textContent = l.nom;
  const srcCarte = `cartes/${l.carte}.png`;
  carteImg.src = srcCarte;
  modaleImg.src = srcCarte;
  const alt = l.carte==="essos" ? "Carte d'Essos" : "Carte de Westeros";
  carteImg.alt = alt; modaleImg.alt = alt;
  for(const p of [pointCarte, modalePoint]){
    p.style.left = l.x + "%";
    p.style.top  = l.y + "%";
  }

  /* Notes */
  notesTa.value = etat.notes[idx] || '';

  renderRail();
  etat.idx = idx; sauver();
  musiqueAuto();
}

notesTa.addEventListener('input', ()=>{
  etat.notes[idx] = notesTa.value; sauver();
});
marquePage.value = etat.marquePage || '';
marquePage.addEventListener('input', ()=>{
  etat.marquePage = marquePage.value; sauver();
});

/* ===== Modale carte agrandie ===== */
document.getElementById('btnAgrandir').onclick = ()=>{
  modale.classList.add('ouverte');
};
document.getElementById('btnFermerCarte').onclick = ()=>{
  modale.classList.remove('ouverte');
};
document.getElementById('btnZoom').onclick = (e)=>{
  modaleWrap.classList.toggle('zoom');
  e.target.textContent = modaleWrap.classList.contains('zoom') ? 'Réduire −' : 'Zoomer +';
};
modale.addEventListener('click', e=>{
  if(e.target === modale) modale.classList.remove('ouverte');
});
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape') modale.classList.remove('ouverte');
});

/* ===== Images (dossier "le trone de fer 1") ===== */
const DOSSIER = "le trone de fer 1";
const EXTS = ["jpg","jpeg","png","webp","JPG","JPEG","PNG","WEBP"];

function chargerImage(i){
  const img = document.getElementById('visuel');
  if(!img) return;
  const num = String(i+1).padStart(2,'0');
  let e = 0;
  function essayer(){
    if(e >= EXTS.length){
      img.classList.remove('ok');
      fond.classList.remove('ok');
      return;
    }
    img.onload = ()=>{
      img.classList.add('ok');
      fond.style.backgroundImage = `url("${img.src}")`;
      fond.classList.add('ok');
    };
    img.onerror = ()=>{ e++; essayer(); };
    img.src = `${DOSSIER}/scene-${num}.${EXTS[e]}`;
  }
  essayer();
}

let actif = new Audio();
actif.loop = true;
let volCible = (etat.volume ?? 20)/100;
actif.volume = volCible;
volume.value = etat.volume ?? 20;
volAffiche.textContent = (etat.volume ?? 20) + '%';
autoChk.checked = !!etat.auto;

let fonduTimer = null;
const themes = [];

function testerFichier(src){
  return new Promise(res=>{
    const t = new Audio();
    t.oncanplaythrough = ()=>res(true);
    t.onerror = ()=>res(false);
    t.src = src;
  });
}

(async function detecterThemes(){
  for(const maison of MAISONS_MUSIQUE){
    for(const v of VARIANTES){
      let trouve = false;
      for(const ext of EXT_AUDIO){
        const nomFichier = `${maison} theme${v}.${ext}`;
        if(await testerFichier(`musique/${encodeURIComponent(nomFichier)}`)){
          themes.push({nom:`${maison}${v?` (${v.trim()})`:''}`, base:maison, src:`musique/${nomFichier}`});
          trouve = true;
          break;
        }
      }
      if(v==="" && !trouve) break;
    }
  }
  if(themes.length === 0){
    corpsMusique.innerHTML = '<p class="vide">Aucune musique installée. Dépose tes fichiers dans le dossier « musique » (ex : Stark theme.mp3) — voir le LISEZ-MOI du dossier.</p>';
    return;
  }
  for(const th of themes){
    const opt = document.createElement('option');
    opt.value = th.src;
    opt.textContent = th.nom;
    choix.appendChild(opt);
  }
  if(etat.theme && themes.some(t=>t.src===etat.theme)){
    choix.value = etat.theme;
  }
  actif.src = choix.value;
})();

function jouerTheme(src, fondu){
  if(actif.src.endsWith(encodeURI(src)) || actif.src===src){ return; }
  etat.theme = src; sauver();
  if(!fondu || actif.paused){
    actif.pause();
    actif = new Audio(src);
    actif.loop = true;
    actif.volume = volCible;
    return;
  }
  const ancien = actif;
  const nouveau = new Audio(src);
  nouveau.loop = true;
  nouveau.volume = 0;
  nouveau.play().catch(()=>{});
  actif = nouveau;
  if(fonduTimer) clearInterval(fonduTimer);
  const duree = 1600, pas = 40;
  let t = 0;
  fonduTimer = setInterval(()=>{
    t += pas;
    const r = Math.min(t/duree, 1);
    nouveau.volume = volCible * r;
    ancien.volume  = Math.max(volCible * (1-r), 0);
    if(r >= 1){
      clearInterval(fonduTimer); fonduTimer = null;
      ancien.pause();
    }
  }, pas);
}

function musiqueAuto(){
  if(!autoChk.checked || themes.length===0) return;
  const prefs = SCENES[idx].themes || [];
  for(const p of prefs){
    const th = themes.find(t=>t.base===p);
    if(th){
      choix.value = th.src;
      jouerTheme(th.src, true);
      return;
    }
  }
}

choix.onchange = ()=>{ jouerTheme(choix.value, true); };

autoChk.onchange = ()=>{
  etat.auto = autoChk.checked; sauver();
  if(autoChk.checked) musiqueAuto();
};

volume.oninput = ()=>{
  volCible = volume.value/100;
  volAffiche.textContent = volume.value + '%';
  if(!fonduTimer) actif.volume = volCible;
  etat.volume = Number(volume.value); sauver();
};

lecture.onclick = ()=>{
  if(actif.paused){
    if(!actif.src && choix.value) { actif.src = choix.value; }
    actif.play().catch(()=>{});
    lecture.textContent = '❚❚';
    lecture.classList.add('joue');
  }else{
    actif.pause();
    lecture.textContent = '▶';
    lecture.classList.remove('joue');
  }
};

let glisse = false;
function formatTemps(s){
  if(!isFinite(s)) return '0:00';
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return `${m}:${String(sec).padStart(2,'0')}`;
}
setInterval(()=>{
  if(glisse || !actif.duration) return;
  progression.value = (actif.currentTime / actif.duration) * 1000;
  tempsActuel.textContent = formatTemps(actif.currentTime);
  tempsTotal.textContent  = formatTemps(actif.duration);
}, 400);
progression.addEventListener('input', ()=>{
  glisse = true;
  if(actif.duration) tempsActuel.textContent = formatTemps((progression.value/1000)*actif.duration);
});
progression.addEventListener('change', ()=>{
  if(actif.duration) actif.currentTime = (progression.value/1000)*actif.duration;
  glisse = false;
});

/* ===== Plein écran ===== */
const btnPE = document.getElementById('btnPleinEcran');
function enPleinEcran(){
  return document.fullscreenElement || document.webkitFullscreenElement;
}
btnPE.onclick = ()=>{
  const racine = document.documentElement;
  if(!enPleinEcran()){
    if(racine.requestFullscreen) racine.requestFullscreen();
    else if(racine.webkitRequestFullscreen) racine.webkitRequestFullscreen();
  }else{
    if(document.exitFullscreen) document.exitFullscreen();
    else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
};
function majBoutonPE(){
  if(enPleinEcran()){
    btnPE.classList.add('actif');
    btnPE.title='Quitter le plein écran';
    btnPE.setAttribute('aria-label','Quitter le plein écran');
  }else{
    btnPE.classList.remove('actif');
    btnPE.title='Plein écran';
    btnPE.setAttribute('aria-label','Passer en plein écran');
  }
}
document.addEventListener('fullscreenchange', majBoutonPE);
document.addEventListener('webkitfullscreenchange', majBoutonPE);

/* ===== Particules d'ambiance ===== */
const cv=document.getElementById('particles');
const ctx=cv.getContext('2d');
let parts=[], mode='neige';
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

function resize(){cv.width=innerWidth;cv.height=innerHeight;}
addEventListener('resize',resize);resize();

function setParticles(m){
  mode=m;parts=[];
  const n = m==='feuilles'?26 : m==='braises'?36 : 60;
  for(let i=0;i<n;i++){
    parts.push({
      x:Math.random()*cv.width,
      y:Math.random()*cv.height,
      r:Math.random()*(m==='feuilles'?5:2.4)+1,
      v:Math.random()*.6+.25,
      a:Math.random()*Math.PI*2
    });
  }
}

function tick(){
  ctx.clearRect(0,0,cv.width,cv.height);
  for(const p of parts){
    p.a+=.01;
    if(mode==='braises'){
      p.y-=p.v; p.x+=Math.sin(p.a)*.5;
      ctx.fillStyle=`rgba(220,${120+Math.floor(Math.sin(p.a)*40+60)},40,.7)`;
    }else if(mode==='feuilles'){
      p.y+=p.v*.8; p.x+=Math.sin(p.a)*1.1;
      ctx.fillStyle='rgba(163,44,44,.75)';
    }else{
      p.y+=p.v; p.x+=Math.sin(p.a)*.4;
      ctx.fillStyle='rgba(232,236,241,.7)';
    }
    if(p.y>cv.height+10)p.y=-10;
    if(p.y<-10)p.y=cv.height+10;
    if(p.x>cv.width+10)p.x=-10;
    if(p.x<-10)p.x=cv.width+10;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
  }
  requestAnimationFrame(tick);
}
if(!reduced){tick();}

render();
</script>
