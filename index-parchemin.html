<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Trône de Fer — Guide d'écoute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --papier:#e9dfc8;
    --papier2:#dfd2b4;
    --encre:#2c2014;
    --encre2:#5a4630;
    --sceau:#8e1c1c;
    --or:#8a6d2f;
    --carte-bord:#b9a781;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{height:100%}
  body{
    min-height:100dvh;
    font-family:'EB Garamond',serif;
    color:var(--encre);
    background:
      radial-gradient(ellipse at 18% 12%, rgba(138,109,47,.10), transparent 45%),
      radial-gradient(ellipse at 85% 30%, rgba(120,90,50,.10), transparent 40%),
      radial-gradient(ellipse at 60% 90%, rgba(90,70,48,.14), transparent 50%),
      linear-gradient(160deg, var(--papier) 0%, var(--papier2) 100%);
  }
  #atmo{display:none}
  canvas#particles{display:none}

  .app{
    position:relative;z-index:2;
    min-height:100dvh;display:flex;flex-direction:column;
    max-width:640px;margin:0 auto;padding:0 20px;
  }
  header{
    padding:20px 0 12px;text-align:center;position:relative;
    border-bottom:3px double var(--encre2);
  }
  header .book{
    font-family:'IM Fell English',serif;
    font-size:1.05rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--encre2);
  }
  header .book b{color:var(--sceau);font-weight:normal}

  #btnPleinEcran,#btnMusique{
    position:absolute;top:16px;
    width:38px;height:38px;border-radius:50%;
    border:1.5px solid var(--encre2);
    background:transparent;color:var(--encre2);
    font-size:1rem;cursor:pointer;transition:all .25s;
  }
  #btnPleinEcran{left:0}
  #btnMusique{right:0;font-size:1.05rem}
  #btnPleinEcran.actif,#btnMusique.joue{border-color:var(--sceau);color:var(--sceau)}
  #btnPleinEcran:focus-visible,#btnMusique:focus-visible{outline:2px solid var(--sceau);outline-offset:2px}

  #panneauMusique{
    display:none;position:absolute;right:0;top:60px;z-index:10;
    width:min(290px,82vw);padding:16px;border-radius:6px;
    background:var(--papier);
    border:1.5px solid var(--encre2);
    box-shadow:4px 5px 0 rgba(44,32,20,.18);
    text-align:left;
  }
  #panneauMusique.ouvert{display:block}
  #panneauMusique label{
    display:block;font-size:.8rem;letter-spacing:.12em;
    text-transform:uppercase;color:var(--encre2);margin-bottom:6px;
  }
  #panneauMusique .vide{font-size:.95rem;line-height:1.5;color:var(--encre2);font-style:italic}
  #choixTheme{
    width:100%;padding:9px 10px;border-radius:4px;
    font-family:'EB Garamond',serif;font-size:1rem;
    background:#f2ead6;color:var(--encre);
    border:1.5px solid var(--encre2);
    margin-bottom:12px;cursor:pointer;
  }
  .ligneAuto{
    display:flex;align-items:center;gap:9px;margin-bottom:14px;
    font-size:.98rem;cursor:pointer;color:var(--encre);
  }
  .ligneAuto input{accent-color:var(--sceau);width:17px;height:17px;cursor:pointer}
  #volume{width:100%;accent-color:var(--or);margin-bottom:12px;cursor:pointer}
  #progression{width:100%;accent-color:var(--sceau);margin-bottom:4px;cursor:pointer}
  #temps{
    display:flex;justify-content:space-between;
    font-size:.85rem;color:var(--encre2);margin-bottom:14px;
    font-variant-numeric:tabular-nums;
  }
  #lecture{
    width:100%;padding:10px 0;border-radius:4px;cursor:pointer;
    font-family:'EB Garamond',serif;font-size:1rem;
    background:transparent;color:var(--encre);
    border:1.5px solid var(--sceau);transition:all .25s;
  }
  #lecture:hover{background:var(--sceau);color:var(--papier)}
  #choixTheme:focus-visible,#volume:focus-visible,#progression:focus-visible,#lecture:focus-visible{
    outline:2px solid var(--sceau);outline-offset:2px;
  }

  .rail{
    display:flex;gap:5px;justify-content:center;
    padding:14px 0 4px;flex-wrap:wrap;max-height:96px;overflow-y:auto;
  }
  .rail button{
    width:24px;height:24px;border-radius:50%;
    border:1.5px solid var(--encre2);
    background:transparent;color:var(--encre2);
    font-family:'EB Garamond',serif;font-size:.7rem;
    cursor:pointer;transition:all .25s;
  }
  .rail button.done{border-color:var(--encre);color:var(--encre)}
  .rail button.active{
    border-color:var(--sceau);background:var(--sceau);
    color:var(--papier);transform:scale(1.15);
    box-shadow:1px 2px 0 rgba(44,32,20,.3);
  }
  .rail button.locked{opacity:.35}
  .rail button:focus-visible{outline:2px solid var(--sceau);outline-offset:2px}

  .scene{
    flex:1;display:flex;flex-direction:column;justify-content:center;
    text-align:center;gap:13px;min-height:0;padding:10px 0 6px;
    animation:fadeIn .8s ease;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .chapitre{
    display:flex;align-items:center;justify-content:center;gap:10px;
    font-size:.85rem;letter-spacing:.22em;text-transform:uppercase;
    color:var(--sceau);
  }
  .chapitre svg{width:30px;height:30px;flex:none;filter:drop-shadow(1px 1px 0 rgba(44,32,20,.25))}
  h1{
    font-family:'IM Fell English',serif;font-weight:normal;
    font-size:clamp(1.6rem,6.5vw,2.4rem);line-height:1.15;color:var(--encre);
  }
  h1::after{
    content:"";display:block;width:110px;height:2px;margin:10px auto 0;
    background:linear-gradient(90deg,transparent,var(--encre2),transparent);
  }
  .visuel{
    display:none;
    max-height:32dvh;width:100%;object-fit:cover;
    border-radius:4px;border:5px solid #f2ead6;
    outline:1.5px solid var(--encre2);
    box-shadow:5px 6px 0 rgba(44,32,20,.18);
    filter:sepia(.18) contrast(.98);
  }
  .visuel.ok{display:block}
  .voile .visuel{filter:blur(14px) sepia(.3)}
  .desc{
    font-size:1.08rem;line-height:1.62;color:var(--encre);
    background:rgba(242,234,214,.65);
    padding:15px 18px;border-radius:4px;
    border:1.5px solid var(--carte-bord);
  }
  .desc::first-letter{
    font-family:'IM Fell English',serif;font-size:1.9em;
    color:var(--sceau);line-height:.9;padding-right:2px;
  }
  .motscles{font-style:italic;color:var(--encre2);font-size:.95rem}
  .motscles::before{content:"❧ ";color:var(--sceau);font-style:normal}

  details{
    background:rgba(242,234,214,.6);
    border:1.5px solid var(--carte-bord);
    border-radius:4px;text-align:left;
  }
  details summary{
    padding:11px 16px;cursor:pointer;list-style:none;
    font-size:.88rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--encre2);display:flex;align-items:center;gap:8px;
  }
  details summary::before{content:"❦";color:var(--sceau);transition:transform .25s}
  details[open] summary::before{transform:rotate(90deg)}
  details summary:focus-visible{outline:2px solid var(--sceau);outline-offset:-2px}
  details .contenu{padding:2px 16px 16px}
  .carteWrap{position:relative;width:fit-content;max-width:100%;margin:0 auto}
  #carteImg{
    display:block;max-height:52dvh;max-width:100%;
    border-radius:4px;border:4px solid #f2ead6;outline:1.5px solid var(--encre2);
  }
  .pointCarte{position:absolute;transform:translate(-50%,-50%);width:0;height:0;pointer-events:none}
  .pointCarte .coeur{
    position:absolute;left:-5px;top:-5px;width:10px;height:10px;
    border-radius:50%;background:#c1121f;border:2px solid #fff;
    box-shadow:0 0 6px rgba(0,0,0,.6);
  }
  .pointCarte .halo{
    position:absolute;left:-11px;top:-11px;width:22px;height:22px;
    border-radius:50%;background:rgba(193,18,31,.35);
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(.7);opacity:.9}50%{transform:scale(1.25);opacity:.35}}
  .carteMsg{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    text-align:center;padding:20px;border-radius:4px;
    background:rgba(233,223,200,.85);color:var(--encre2);
    font-style:italic;font-size:.98rem;line-height:1.5;
  }
  .carteMsg.visible{display:flex}
  .lieuNom{text-align:center;font-style:italic;color:var(--sceau);font-size:.95rem;margin-top:6px}
  #zoneNotes textarea{
    width:100%;min-height:84px;resize:vertical;
    font-family:'EB Garamond',serif;font-size:1rem;line-height:1.5;
    background:#f2ead6;color:var(--encre);
    border:1.5px solid var(--carte-bord);border-radius:4px;
    padding:10px 12px;
  }
  #zoneNotes label{
    display:block;font-size:.8rem;letter-spacing:.12em;
    text-transform:uppercase;color:var(--encre2);margin:12px 0 6px;
  }
  #marquePage{
    width:100%;padding:9px 12px;border-radius:4px;
    font-family:'EB Garamond',serif;font-size:1rem;
    background:#f2ead6;color:var(--encre);
    border:1.5px solid var(--carte-bord);
  }
  #zoneNotes textarea:focus-visible,#marquePage:focus-visible{outline:2px solid var(--sceau);outline-offset:1px}

  .voile .desc,.voile h1,.voile .motscles{filter:blur(9px);user-select:none}
  .voile{position:relative}
  .voile .avert{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;z-index:3;
  }
  .avert p{font-style:italic;color:var(--encre2)}
  .avert button{
    font-family:'EB Garamond',serif;font-size:1rem;
    padding:10px 22px;border-radius:999px;cursor:pointer;
    background:var(--papier);color:var(--encre);
    border:1.5px solid var(--sceau);transition:all .25s;
  }
  .avert button:hover{background:var(--sceau);color:var(--papier)}

  nav{display:flex;gap:12px;padding:14px 0 26px}
  nav button{
    flex:1;padding:14px 0;border-radius:4px;cursor:pointer;
    font-family:'EB Garamond',serif;font-size:1.05rem;
    border:1.5px solid var(--encre2);
    background:rgba(242,234,214,.6);color:var(--encre);
    transition:all .25s;box-shadow:3px 4px 0 rgba(44,32,20,.15);
  }
  nav button:disabled{opacity:.3;cursor:default;box-shadow:none}
  nav button.next{border-color:var(--sceau);color:var(--sceau)}
  nav button.next:not(:disabled):hover{background:var(--sceau);color:var(--papier)}
  nav button:focus-visible{outline:2px solid var(--sceau);outline-offset:2px}

  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="atmo"></div>
<canvas id="particles"></canvas>

<div class="app">
  <header>
    <button id="btnPleinEcran" aria-label="Passer en plein écran" title="Plein écran">⛶</button>
    <div class="book"><b>Le Trône de Fer</b> · Tome 1 · Guide d'écoute</div>
    <button id="btnMusique" aria-label="Ouvrir le panneau musique" title="Musique de fond">♪</button>
    <div id="panneauMusique">
      <label for="choixTheme">Thème musical</label>
      <select id="choixTheme"></select>
      <label class="ligneAuto"><input type="checkbox" id="autoMusique"> Choisir selon le chapitre</label>
      <label for="volume">Volume</label>
      <input type="range" id="volume" min="0" max="100" value="20">
      <label for="progression">Position dans le morceau</label>
      <input type="range" id="progression" min="0" max="1000" value="0">
      <div id="temps"><span id="tempsActuel">0:00</span><span id="tempsTotal">0:00</span></div>
      <button id="lecture">Lancer la musique</button>
    </div>
  </header>
  <div class="rail" id="rail"></div>
  <main class="scene" id="scene"></main>
  <details id="zoneCarte">
    <summary>Carte — <span id="lieuTitre"></span></summary>
    <div class="contenu">
      <div class="carteWrap" id="carteWrap">
        <img id="carteImg" src="cartes/westeros.png" alt="Carte de Westeros">
        <div class="pointCarte" id="pointCarte"><span class="halo"></span><span class="coeur"></span></div>
        <div class="carteMsg" id="carteMsg"></div>
      </div>
      <div class="lieuNom" id="lieuNom"></div>
    </div>
  </details>
  <div style="height:10px"></div>
  <details id="zoneNotes">
    <summary>Mes notes & marque-page</summary>
    <div class="contenu">
      <label for="notesChapitre">Notes sur ce chapitre</label>
      <textarea id="notesChapitre" placeholder="Impressions, théories, personnages à retenir…"></textarea>
      <label for="marquePage">Marque-page audio (où j'en suis dans Audible)</label>
      <input type="text" id="marquePage" placeholder="Ex : 4 h 32 min — chapitre 12">
    </div>
  </details>
  <nav>
    <button id="prev">← Précédent</button>
    <button id="next" class="next">Suivant →</button>
  </nav>
</div>

<script>
/* =====================================================
   DONNÉES — 36 chapitres du livre audio
   maison : blason affiché (stark, targaryen, lannister, garde)
   lieu   : position sur la carte {nom, x, y}
   themes : thèmes musicaux préférés, par ordre de priorité
===================================================== */
const LIEUX = {
  audela:   {nom:"Au-delà du Mur — la forêt hantée", carte:"westeros", x:59.0, y:5.8},
  mur:      {nom:"Châteaunoir · le Mur", carte:"westeros", x:58.5, y:9.0},
  versmur:  {nom:"La route royale, vers le Mur", carte:"westeros", x:49.0, y:16.0},
  winterfell:{nom:"Winterfell", carte:"westeros", x:44.0, y:23.6},
  routeroy: {nom:"La route royale, vers le sud", carte:"westeros", x:42.5, y:38.0},
  trident:  {nom:"Le Trident", carte:"westeros", x:55.0, y:56.8},
  darry:    {nom:"Château de Darry", carte:"westeros", x:62.0, y:58.0},
  auberge:  {nom:"L'auberge du carrefour", carte:"westeros", x:54.0, y:56.0},
  eyrie:    {nom:"Les Eyrié · le Val d'Arryn", carte:"westeros", x:66.5, y:49.6},
  hauteroute:{nom:"La haute route · montagnes de la Lune", carte:"westeros", x:63.0, y:52.3},
  portreal: {nom:"Port-Réal", carte:"westeros", x:68.0, y:69.2},
  pentos:   {nom:"Pentos — en Essos", carte:"essos", x:10.5, y:47.0},
  merdothrak:{nom:"La mer Dothrak — en Essos", carte:"essos", x:55.5, y:58.5},
  khalasar: {nom:"Avec le khalasar, vers l'est — en Essos", carte:"essos", x:33.0, y:50.0}
};

const TH_NORD   = ["Stark","Main theme"];
const TH_GARDE  = ["Garde de Nuit","Stark","Main theme"];
const TH_SUD    = ["Baratheon","Lannister","Main theme"];
const TH_TARG   = ["Targaryen","Dothraki","Main theme"];
const TH_LANN   = ["Lannister","Main theme"];
const TH_TULLY  = ["Tully","Stark","Main theme"];
const TH_ARRYN  = ["Arryn","Tully","Main theme"];

const SCENES = [
  {chap:"Chapitre 1 · Prologue",titre:"Au-delà du Mur",desc:"Trois patrouilleurs de la Garde de Nuit s'enfoncent dans la forêt hantée, sur la piste de sauvageons. Le froid tombe, trop vite, trop fort — et quelque chose les observe entre les arbres.",mots:"forêt hantée · givre · ombres pâles",atmo:"linear-gradient(180deg,#0a0f16 0%,#14202e 55%,#233648 100%)",part:"neige",maison:"garde",lieu:"audela",themes:TH_GARDE},
  {chap:"Chapitre 2 · Bran",titre:"L'exécution du déserteur",desc:"Ned Stark décapite lui-même un déserteur devant ses fils. « Celui qui prononce la sentence doit tenir l'épée. » Sur le chemin du retour : une louve géante morte, et ses petits encore vivants.",mots:"billot · Glace · six louveteaux et un blanc",atmo:"linear-gradient(180deg,#1a2230 0%,#2c3a4d 55%,#46586e 100%)",part:"neige",maison:"stark",lieu:"winterfell",themes:TH_NORD},
  {chap:"Chapitre 3 · Catelyn",titre:"Le bois sacré",desc:"Catelyn rejoint Ned sous le barral, arbre blanc aux feuilles rouge sang. Elle apporte deux nouvelles : Jon Arryn, la Main du Roi, est mort — et le roi Robert chevauche vers Winterfell.",mots:"barral · étangs noirs · une lettre du sud",atmo:"linear-gradient(180deg,#111820 0%,#1e2a28 50%,#31261f 100%)",part:"feuilles",maison:"stark",lieu:"winterfell",themes:TH_NORD},
  {chap:"Chapitre 4 · Daenerys",titre:"La promise de Pentos",desc:"De l'autre côté du détroit, Daenerys Targaryen est offerte par son frère Viserys à Khal Drogo, seigneur de cheval dothraki. Soies, épices — et la peur d'une enfant vendue contre une armée.",mots:"villa d'Illyrio · soie violette · la mer étroite",atmo:"linear-gradient(180deg,#2a1a2e 0%,#57263a 50%,#8f5a3a 100%)",part:"braises",maison:"targaryen",lieu:"pentos",themes:TH_TARG},
  {chap:"Chapitre 5 · Eddard",titre:"L'arrivée du roi",desc:"Robert Baratheon franchit les portes de Winterfell avec toute sa cour. Dans les cryptes, devant la tombe de Lyanna, il demande à Ned de devenir sa nouvelle Main.",mots:"bannières · cryptes · la statue de Lyanna",atmo:"linear-gradient(180deg,#202836 0%,#3d4657 45%,#6b6353 100%)",part:"neige",maison:"stark",lieu:"winterfell",themes:TH_NORD},
  {chap:"Chapitre 6 · Jon",titre:"Le festin",desc:"La grande salle rugit de musique et de vin. Relégué loin de l'estrade, Jon y gagne la liberté de boire — et une leçon de Tyrion Lannister : « N'oublie jamais ce que tu es… fais-t'en une armure. »",mots:"torches · le nain et le bâtard · vin épicé",atmo:"linear-gradient(180deg,#1c130c 0%,#3d2412 50%,#6e451c 100%)",part:"braises",maison:"stark",lieu:"winterfell",themes:TH_NORD},
  {chap:"Chapitre 7 · Catelyn",titre:"La lettre de Lysa",desc:"En pleine nuit, un message chiffré arrive du Val d'Arryn. Ce que Lysa y affirme change tout : Ned ne peut plus refuser le sud, et Winterfell ne dormira plus tranquille.",mots:"chandelle · message chiffré · décision",atmo:"linear-gradient(180deg,#131a24 0%,#232f40 55%,#38495e 100%)",part:"neige",maison:"stark",lieu:"winterfell",themes:TH_NORD},
  {chap:"Chapitre 8 · Arya",titre:"L'aiguille d'Arya",desc:"Pendant que Sansa brille aux travaux d'aiguille, Arya rêve d'épées et file rejoindre les garçons dans la cour. Sa louve s'appelle Nymeria, comme une reine guerrière.",mots:"couture abandonnée · cour d'entraînement · Nymeria",atmo:"linear-gradient(180deg,#1a2230 0%,#2e3c50 55%,#4a5c72 100%)",part:"neige",maison:"stark",lieu:"winterfell",themes:TH_NORD},
  {chap:"Chapitre 9 · Bran",titre:"Le petit grimpeur",desc:"Bran grimpe les murs de Winterfell comme il l'a toujours fait, sûr de ses mains, malgré les interdictions de sa mère. Ce jour-là, la vieille tour abandonnée n'est pas vide.",mots:"pierres descellées · gargouilles · la fenêtre",atmo:"linear-gradient(180deg,#151d28 0%,#28354a 55%,#41536e 100%)",part:"neige",maison:"stark",lieu:"winterfell",themes:TH_NORD},
  {chap:"Chapitre 10 · Tyrion",titre:"Le lion au petit matin",desc:"Tyrion lit avant l'aube, déjeune copieusement, et distribue quelques vérités bien senties — dont une leçon mémorable à son royal neveu Joffrey.",mots:"livres · saucisses et bière · gifles princières",atmo:"linear-gradient(180deg,#1c1610 0%,#332618 50%,#584023 100%)",part:"braises",maison:"lannister",lieu:"winterfell",themes:TH_LANN},
  {chap:"Chapitre 11 · Jon",titre:"Les adieux",desc:"Winterfell se vide. Jon fait ses adieux à Bran endormi, à Robb, à Arya — à qui il offre un cadeau très particulier. Ned lui promet qu'à leur prochaine rencontre, ils parleront de sa mère.",mots:"malles · un cadeau effilé · promesse",atmo:"linear-gradient(180deg,#18202c 0%,#2b3646 50%,#465666 100%)",part:"neige",maison:"stark",lieu:"winterfell",themes:TH_NORD},
  {chap:"Chapitre 12 · Daenerys",titre:"Le mariage dothraki",desc:"Sous le ciel ouvert, un mariage dothraki sans au moins trois morts passe pour une fête morne. Au terme des festivités, Daenerys reçoit trois œufs de dragon pétrifiés — beaux, anciens, impossibles.",mots:"tambours · duels · trois œufs d'écailles",atmo:"linear-gradient(180deg,#20161f 0%,#4a2a2a 50%,#7d5030 100%)",part:"braises",maison:"targaryen",lieu:"pentos",themes:TH_TARG},

/* ===== État & sauvegarde ===== */
const CLE = 'asoiaf-tome1';
let etat = {
  idx: 0,
  revealed: [0,1,2,3,4,5],
  volume: 20,
  theme: null,
  auto: false,
  notes: {},
  marquePage: ''
};

function charger(){
  try{
    const brut = localStorage.getItem(CLE);
    if(brut){ etat = Object.assign(etat, JSON.parse(brut)); }
  }catch(e){ /* stockage indisponible : le site fonctionne sans sauvegarde */ }
}
function sauver(){
  try{ localStorage.setItem(CLE, JSON.stringify(etat)); }catch(e){}
}
charger();

let idx = Math.min(Math.max(etat.idx,0), SCENES.length-1);
let revealed = new Set(etat.revealed);

/* ===== Éléments ===== */
const atmo   = document.getElementById('atmo');
const sceneEl= document.getElementById('scene');
const rail   = document.getElementById('rail');
const prev   = document.getElementById('prev');
const next   = document.getElementById('next');
const lieuNom= document.getElementById('lieuNom');
const lieuTitre = document.getElementById('lieuTitre');
const carteImg  = document.getElementById('carteImg');
const pointCarte= document.getElementById('pointCarte');
const carteMsg  = document.getElementById('carteMsg');
const notesTa   = document.getElementById('notesChapitre');
const marquePage= document.getElementById('marquePage');

/* ===== Rendu ===== */
function renderRail(){
  rail.innerHTML='';
  SCENES.forEach((s,i)=>{
    const b=document.createElement('button');
    b.textContent=i+1;
    b.setAttribute('aria-label','Chapitre '+(i+1)+' : '+s.titre);
    if(i===idx)b.classList.add('active');
    else if(revealed.has(i))b.classList.add('done');
    else b.classList.add('locked');
    b.onclick=()=>{idx=i;render();};
    rail.appendChild(b);
  });
}

function render(){
  const s=SCENES[idx];
  atmo.style.background=s.atmo;
  setParticles(s.part);
  const locked=!revealed.has(idx);
  sceneEl.className='scene'+(locked?' voile':'');
  sceneEl.innerHTML=`
    <div class="chapitre">${BLASONS[s.maison]||''}<span>${s.chap}</span></div>
    <h1>${s.titre}</h1>
    <img class="visuel" id="visuel" alt="Illustration : ${s.titre}">
    <div class="desc">${s.desc}</div>
    <div class="motscles">${s.mots}</div>
    ${locked?`<div class="avert">
      <p>Tu n'es peut-être pas encore arrivé ici…</p>
      <button id="reveal">Révéler le chapitre</button>
    </div>`:''}
  `;
  if(locked){
    document.getElementById('reveal').onclick=()=>{
      revealed.add(idx);
      etat.revealed=[...revealed];sauver();
      render();
    };
  }
  chargerImage(idx);

  /* Carte */
  const l = LIEUX[s.lieu];
  lieuNom.textContent = l.nom;
  lieuTitre.textContent = l.nom;
  carteImg.src = `cartes/${l.carte}.png`;
  carteImg.alt = l.carte === "essos" ? "Carte d'Essos" : "Carte de Westeros";
  carteImg.style.opacity = "1";
  pointCarte.style.display = "block";
  pointCarte.style.left = l.x + "%";
  pointCarte.style.top  = l.y + "%";
  carteMsg.classList.remove('visible');

  /* Notes */
  notesTa.value = etat.notes[idx] || '';

  prev.disabled = idx===0;
  next.disabled = idx===SCENES.length-1;
  renderRail();

  etat.idx = idx; sauver();
  musiqueAuto();
}

prev.onclick=()=>{if(idx>0){idx--;render();}};
next.onclick=()=>{if(idx<SCENES.length-1){idx++;render();}};

notesTa.addEventListener('input', ()=>{
  etat.notes[idx] = notesTa.value; sauver();
});
marquePage.value = etat.marquePage || '';
marquePage.addEventListener('input', ()=>{
  etat.marquePage = marquePage.value; sauver();
});

/* ===== Images (dossier "le trone de fer 1") ===== */
const DOSSIER = "le trone de fer 1";
const EXTS = ["jpg","jpeg","png","webp"];

function chargerImage(i){
  const img = document.getElementById('visuel');
  if(!img) return;
  const num = String(i+1).padStart(2,'0');
  let e = 0;
  function essayer(){
    if(e >= EXTS.length){ img.classList.remove('ok'); return; }
    img.onload = ()=>img.classList.add('ok');
    img.onerror = ()=>{ e++; essayer(); };
    img.src = `${DOSSIER}/scene-${num}.${EXTS[e]}`;
  }
  essayer();
}

/* =====================================================
   MUSIQUE — thèmes par maison, fondu enchaîné, mode auto
===================================================== */
const MAISONS_MUSIQUE = [
  "Stark","Targaryen","Lannister","Baratheon","Greyjoy",
  "Tully","Arryn","Martell","Tyrell","Dothraki",
  "Garde de Nuit","Main theme"
];
const EXT_AUDIO = ["mp3","ogg","m4a"];
const VARIANTES = [""," 2"," 3"];

const btnMus   = document.getElementById('btnMusique');
const panneau  = document.getElementById('panneauMusique');
const choix    = document.getElementById('choixTheme');
const autoChk  = document.getElementById('autoMusique');
const volume   = document.getElementById('volume');
const progression = document.getElementById('progression');
const tempsActuel = document.getElementById('tempsActuel');
const tempsTotal  = document.getElementById('tempsTotal');
const lecture  = document.getElementById('lecture');

let actif = new Audio();        // piste en cours
actif.loop = true;
let volCible = (etat.volume ?? 20)/100;
actif.volume = volCible;
volume.value = etat.volume ?? 20;
autoChk.checked = !!etat.auto;

let fonduTimer = null;
const themes = []; // {nom, base, src}

function testerFichier(src){
  return new Promise(res=>{
    const t = new Audio();
    t.oncanplaythrough = ()=>res(true);
    t.onerror = ()=>res(false);
    t.src = src;
  });
}

(async function detecterThemes(){
  for(const maison of MAISONS_MUSIQUE){
    for(const v of VARIANTES){
      let trouve = false;
      for(const ext of EXT_AUDIO){
        const nomFichier = `${maison} theme${v}.${ext}`;
        if(await testerFichier(`musique/${encodeURIComponent(nomFichier)}`)){
          themes.push({nom:`${maison}${v?` (${v.trim()})`:''}`, base:maison, src:`musique/${nomFichier}`});
          trouve = true;
          break;
        }
      }
      if(v==="" && !trouve) break;
    }
  }
  if(themes.length === 0){
    choix.style.display='none';
    volume.style.display='none';
    lecture.style.display='none';
    progression.style.display='none';
    document.getElementById('temps').style.display='none';
    panneau.querySelectorAll('label').forEach(l=>l.style.display='none');
    const msg = document.createElement('p');
    msg.className='vide';
    msg.textContent = 'Aucune musique installée. Dépose tes fichiers dans le dossier « musique » (ex : Stark theme.mp3) — voir le LISEZ-MOI du dossier.';
    panneau.appendChild(msg);
    return;
  }
  for(const th of themes){
    const opt = document.createElement('option');
    opt.value = th.src;
    opt.textContent = th.nom;
    choix.appendChild(opt);
  }
  /* Restaurer le dernier thème choisi */
  if(etat.theme && themes.some(t=>t.src===etat.theme)){
    choix.value = etat.theme;
  }
  actif.src = choix.value;
})();

/* --- Fondu enchaîné --- */
function jouerTheme(src, fondu){
  if(actif.src.endsWith(encodeURI(src)) || actif.src===src){ return; }
  etat.theme = src; sauver();
  if(!fondu || actif.paused){
    actif.pause();
    actif = new Audio(src);
    actif.loop = true;
    actif.volume = volCible;
    return;
  }
  const ancien = actif;
  const nouveau = new Audio(src);
  nouveau.loop = true;
  nouveau.volume = 0;
  nouveau.play().catch(()=>{});
  actif = nouveau;
  if(fonduTimer) clearInterval(fonduTimer);
  const duree = 1600, pas = 40;
  let t = 0;
  fonduTimer = setInterval(()=>{
    t += pas;
    const r = Math.min(t/duree, 1);
    nouveau.volume = volCible * r;
    ancien.volume  = Math.max(volCible * (1-r), 0);
    if(r >= 1){
      clearInterval(fonduTimer); fonduTimer = null;
      ancien.pause();
    }
  }, pas);
}

/* --- Mode auto : le thème suit le chapitre --- */
function musiqueAuto(){
  if(!autoChk.checked || themes.length===0) return;
  const prefs = SCENES[idx].themes || [];
  for(const p of prefs){
    const th = themes.find(t=>t.base===p);
    if(th){
      choix.value = th.src;
      jouerTheme(th.src, true);
      return;
    }
  }
}

/* --- Contrôles --- */
btnMus.onclick = ()=>{ panneau.classList.toggle('ouvert'); };

choix.onchange = ()=>{ jouerTheme(choix.value, true); };

autoChk.onchange = ()=>{
  etat.auto = autoChk.checked; sauver();
  if(autoChk.checked) musiqueAuto();
};

volume.oninput = ()=>{
  volCible = volume.value/100;
  if(!fonduTimer) actif.volume = volCible;
  etat.volume = Number(volume.value); sauver();
};

lecture.onclick = ()=>{
  if(actif.paused){
    if(!actif.src && choix.value) { actif.src = choix.value; }
    actif.play().catch(()=>{});
    lecture.textContent = 'Couper la musique';
    btnMus.classList.add('joue');
    btnMus.textContent = '♫';
  }else{
    actif.pause();
    lecture.textContent = 'Lancer la musique';
    btnMus.classList.remove('joue');
    btnMus.textContent = '♪';
  }
};

/* --- Position dans le morceau --- */
let glisse = false;
function formatTemps(s){
  if(!isFinite(s)) return '0:00';
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return `${m}:${String(sec).padStart(2,'0')}`;
}
setInterval(()=>{
  if(glisse || !actif.duration) return;
  progression.value = (actif.currentTime / actif.duration) * 1000;
  tempsActuel.textContent = formatTemps(actif.currentTime);
  tempsTotal.textContent  = formatTemps(actif.duration);
}, 400);
progression.addEventListener('input', ()=>{
  glisse = true;
  if(actif.duration) tempsActuel.textContent = formatTemps((progression.value/1000)*actif.duration);
});
progression.addEventListener('change', ()=>{
  if(actif.duration) actif.currentTime = (progression.value/1000)*actif.duration;
  glisse = false;
});

/* Fermer le panneau si on touche ailleurs */
document.addEventListener('click', e=>{
  if(!panneau.contains(e.target) && e.target !== btnMus){
    panneau.classList.remove('ouvert');
  }
});

/* ===== Plein écran ===== */
const btnPE = document.getElementById('btnPleinEcran');
function enPleinEcran(){
  return document.fullscreenElement || document.webkitFullscreenElement;
}
btnPE.onclick = ()=>{
  const racine = document.documentElement;
  if(!enPleinEcran()){
    if(racine.requestFullscreen) racine.requestFullscreen();
    else if(racine.webkitRequestFullscreen) racine.webkitRequestFullscreen();
  }else{
    if(document.exitFullscreen) document.exitFullscreen();
    else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
};
function majBoutonPE(){
  if(enPleinEcran()){
    btnPE.classList.add('actif');
    btnPE.title='Quitter le plein écran';
    btnPE.setAttribute('aria-label','Quitter le plein écran');
  }else{
    btnPE.classList.remove('actif');
    btnPE.title='Plein écran';
    btnPE.setAttribute('aria-label','Passer en plein écran');
  }
}
document.addEventListener('fullscreenchange', majBoutonPE);
document.addEventListener('webkitfullscreenchange', majBoutonPE);

/* ===== Particules d'ambiance ===== */
const cv=document.getElementById('particles');
const ctx=cv.getContext('2d');
let parts=[], mode='neige', raf;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

function resize(){cv.width=innerWidth;cv.height=innerHeight;}
addEventListener('resize',resize);resize();

function setParticles(m){
  mode=m;parts=[];
  const n = m==='feuilles'?26 : m==='braises'?36 : 60;
  for(let i=0;i<n;i++){
    parts.push({
      x:Math.random()*cv.width,
      y:Math.random()*cv.height,
      r:Math.random()*(m==='feuilles'?5:2.4)+1,
      v:Math.random()*.6+.25,
      a:Math.random()*Math.PI*2
    });
  }
}

function tick(){
  ctx.clearRect(0,0,cv.width,cv.height);
  for(const p of parts){
    p.a+=.01;
    if(mode==='braises'){
      p.y-=p.v; p.x+=Math.sin(p.a)*.5;
      ctx.fillStyle=`rgba(220,${120+Math.floor(Math.sin(p.a)*40+60)},40,.7)`;
    }else if(mode==='feuilles'){
      p.y+=p.v*.8; p.x+=Math.sin(p.a)*1.1;
      ctx.fillStyle='rgba(163,44,44,.75)';
    }else{
      p.y+=p.v; p.x+=Math.sin(p.a)*.4;
      ctx.fillStyle='rgba(232,236,241,.7)';
    }
    if(p.y>cv.height+10)p.y=-10;
    if(p.y<-10)p.y=cv.height+10;
    if(p.x>cv.width+10)p.x=-10;
    if(p.x<-10)p.x=cv.width+10;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
  }
  raf=requestAnimationFrame(tick);
}
if(!reduced){tick();}

render();
</script>
